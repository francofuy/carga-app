<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carga">
<meta name="theme-color" content="#000000">
<title>Carga</title>
<style>
:root {
  --bg: #000; --sheet: #141414; --chip: #262629; --ink: #fff; --ink-2: #8e8e93; --accent: #4fb58a; --warn: #e5a93b;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); overscroll-behavior: none; }
body { display: grid; place-items: center; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; font-variant-numeric: tabular-nums; touch-action: manipulation; }
[hidden] { display: none !important; } /* si no, las reglas display de las clases pisan el atributo hidden */
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
ul { list-style: none; }

/* ---------- Teléfono ---------- */
.phone { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: var(--bg); --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 600px) {
  body { background: #0b0b0b; height: 100vh; }
  .phone { width: 402px; height: 874px; border-radius: 56px; transform-origin: center; outline: 10px solid #1a1a1a; --safe-top: 59px; --safe-bottom: 34px; }
  .phone::before { content: ""; position: absolute; z-index: 80; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; pointer-events: none; }
}

/* ---------- Inicio ---------- */
.home { position: absolute; inset: 0; display: flex; flex-direction: column; }
.home-bar { padding: calc(var(--safe-top) + 14px) 24px 0; text-align: center; font-size: 17px; min-height: calc(var(--safe-top) + 44px); }
.home-bar span { color: var(--ink-2); }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px calc(238px + var(--safe-bottom)); }
.head { font-size: min(56px, 14vw); font-weight: 300; letter-spacing: -0.035em; line-height: 1.06; text-align: center; }
.head span { display: block; }
.tray, .tray2 { position: relative; background: var(--sheet); border-radius: 44px 44px 0 0; height: calc(262px + var(--safe-bottom)); flex: none; }
.tray { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; }
.pointer { position: absolute; top: 22px; left: 50%; margin-left: -10px; }
.rail { position: absolute; top: 40px; left: 0; right: 0; height: 140px; display: flex; align-items: center; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.rail::-webkit-scrollbar { display: none; }
.rail::before, .rail::after { content: ""; flex: 0 0 calc(50% - 50px); }
.rail.mouse-drag { scroll-snap-type: none; cursor: grabbing; }
.slot { flex: none; width: 100px; height: 140px; display: grid; place-items: center; scroll-snap-align: center; scroll-snap-stop: always; }
.slot .c { --k: 0; width: 126px; height: 126px; border-radius: 50%; display: grid; place-items: center; will-change: transform;
  background: color-mix(in srgb, var(--accent) calc(var(--k) * 100%), var(--chip));
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, calc(0.06 + var(--k) * 0.16));
  color: color-mix(in srgb, #fff calc(var(--k) * 100%), #a0a0a5); }
.slot svg { width: 54px; height: 54px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
/* Dial de valor exacto: círculo central + ajuste fino + regla */
.dial { position: absolute; top: 40px; left: 0; right: 0; height: 126px; }
.go { position: absolute; left: 50%; top: 0; width: 126px; height: 126px; margin-left: -63px; border-radius: 50%; background: var(--accent); color: #fff;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.22); display: grid; place-items: center; font-weight: 300; letter-spacing: -0.02em; transition: transform 140ms var(--ease-out); }
.go:active { transform: scale(0.97); }
.nudge { position: absolute; border-radius: 50%; background: var(--chip); color: #c7c7cc; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06); display: grid; place-items: center; font-size: 16px; transition: transform 140ms var(--ease-out); }
.nudge:active { transform: scale(0.94); }
.nudge.s { width: 56px; height: 56px; top: 35px; }
.nudge.l { width: 48px; height: 48px; top: 39px; font-size: 15px; color: var(--ink-2); }
.nudge[data-n="-0.1"] { left: max(8px, calc(50% - 129px)); }
.nudge[data-n="-1"] { left: max(8px, calc(50% - 187px)); }
.nudge[data-n="0.1"] { left: calc(50% + 73px); }
.nudge[data-n="1"] { left: calc(50% + 139px); }
.ruler { position: absolute; top: 182px; left: 0; right: 0; height: 44px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; cursor: grab; }
.ruler::-webkit-scrollbar { display: none; }
.ruler.mouse-drag { cursor: grabbing; }
.ruler-in { position: relative; height: 44px; }
.ticks { --px: 80px; position: absolute; bottom: 14px; height: 16px; background-image: linear-gradient(90deg, #55555a 1px, transparent 1px), linear-gradient(90deg, #a0a0a5 1.5px, transparent 1.5px); background-size: var(--minor, 8px) 8px, var(--major, 80px) 16px; background-repeat: repeat-x; background-position: left bottom; } /* taste-skill-ignore: marcas de 1 px de la regla, no un degradé decorativo */
.ruler-in span { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 12px; color: var(--ink-2); }
.mark { position: absolute; top: 182px; left: 50%; width: 2px; height: 30px; margin-left: -1px; border-radius: 1px; background: var(--accent); pointer-events: none; }
.tray2 .hint { top: 234px; }
.inl { width: 4.2ch; text-align: center; background: #1c1c1e; border: 0; border-radius: 8px; color: var(--ink); font: inherit; font-size: 17px; padding: 2px 4px; margin: 0 2px; -webkit-user-select: text; user-select: text; }
.from-in { width: 160px; background: none; border: 0; text-align: center; color: var(--ink); caret-color: var(--accent); font: inherit; font-size: 28px; font-weight: 300; -webkit-user-select: text; user-select: text; }
.hint { position: absolute; top: 196px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--ink-2); }

/* ---------- Funciones ---------- */
.fn { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--bg); opacity: 0; visibility: hidden; transform: translateY(20px);
  transition: opacity 200ms var(--ease-out), transform 240ms var(--ease-out), visibility 0s 240ms; }
.fn.open { opacity: 1; visibility: visible; transform: none; transition: opacity 220ms var(--ease-out), transform 360ms var(--ease-drawer), visibility 0s; }
#fn-det { z-index: 50; }
.fn-bar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(var(--safe-top) + 8px) 16px 0; flex: none; }
.fn-bar h2 { font-size: 17px; font-weight: 600; text-align: center; }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); font-size: 15px; font-weight: 500; transition: transform 140ms var(--ease-out); }
.icon:active { transform: scale(0.94); }
.icon svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fn-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px 24px; text-align: center; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 24px calc(var(--safe-bottom) + 28px); }
.scroll::-webkit-scrollbar { display: none; }
.hero2 { padding: 28px 0 8px; text-align: center; }
.big { font-size: min(72px, 18vw); font-weight: 300; letter-spacing: -0.04em; line-height: 1; }
.big .cur { font-size: 0.46em; margin-right: 0.1em; color: var(--ink-2); letter-spacing: 0; vertical-align: top; position: relative; top: 0.12em; }
.big small { font-size: 0.34em; margin-left: 0.12em; color: var(--ink-2); letter-spacing: 0; font-weight: 400; }
.sub { margin-top: 14px; font-size: 17px; }
.find { margin: 8px auto 0; max-width: 300px; font-size: 15px; line-height: 1.35; color: var(--ink-2); text-wrap: balance; }
h3 { margin: 30px 0 4px; font-size: 13px; font-weight: 400; color: var(--ink-2); }
.kv { display: flex; justify-content: space-between; align-items: baseline; min-height: 48px; padding: 12px 0; font-size: 17px; gap: 16px; }
.kv span { color: var(--ink-2); font-size: 15px; }
.kv em { display: block; margin-top: 3px; font-style: normal; font-size: 13px; color: var(--ink-2); }
.kv b { font-weight: 500; text-align: right; }
.note { padding: 14px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }

.bar3 { display: flex; gap: 2px; height: 6px; margin: 14px 0 8px; border-radius: 3px; overflow: hidden; }
.bar3 i { display: block; min-width: 2px; }
.leg { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.bars { display: flex; align-items: flex-end; justify-content: space-between; height: 84px; margin-top: 14px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; font-size: 12px; color: var(--ink-2); }
.bars i { display: block; width: 22px; border-radius: 4px 4px 0 0; background: #3a3a3c; min-height: 2px; }
.bars div.on i { background: var(--ink); }

.month { margin: 22px 0 6px; font-size: 13px; color: var(--ink-2); }
.month:first-child { margin-top: 6px; }
.row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; min-height: 68px; }
.row .d { font-size: 15px; color: var(--ink-2); }
.row b { display: block; font-size: 17px; font-weight: 500; }
.row i { display: block; margin-top: 3px; font-size: 13px; font-style: normal; color: var(--ink-2); }
.row .c { font-size: 17px; text-align: right; }

.seg { display: flex; padding: 3px; border-radius: 999px; background: #151517; justify-self: center; }
.seg button { position: relative; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 15px; color: var(--ink-2); transition: background-color 160ms ease, color 160ms ease; white-space: nowrap; }
.seg button::before { content: ""; position: absolute; inset: -4px 0; }
.seg button[aria-pressed="true"] { background: #2c2c2e; color: var(--ink); }
.seg.wide { display: flex; margin-top: 18px; }
.seg.wide button { flex: 1; padding: 0 4px; }

/* Asistente: una pregunta por pantalla con el mismo dial de Registrar */
.fn-bar.w { grid-template-columns: 64px 1fr 64px; }
.icon.txt { width: auto; padding: 0 10px; border-radius: 999px; justify-self: end; }
.dots { display: flex; gap: 7px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: #3a3a3c; transition: background-color 200ms var(--ease-out), width 200ms var(--ease-out); }
.dots i.done { background: var(--accent); }
.dots i.on { width: 18px; background: var(--ink); }
.q { max-width: 300px; margin-bottom: 14px; font-size: 20px; font-weight: 500; line-height: 1.25; text-wrap: balance; }
.wextra { width: 100%; max-width: 340px; }
.wextra .kv { text-align: left; }
.inl-link { margin: 0; height: 32px; padding: 0 6px; color: var(--accent); }
.nudge.p0 { left: max(8px, calc(50% - 187px)); width: 48px; height: 48px; top: 39px; font-size: 15px; color: var(--ink-2); }
.nudge.p1 { left: max(8px, calc(50% - 129px)); width: 56px; height: 56px; top: 35px; }
.nudge.p2 { left: calc(50% + 73px); width: 56px; height: 56px; top: 35px; }
.nudge.p3 { left: calc(50% + 139px); width: 48px; height: 48px; top: 39px; font-size: 15px; color: var(--ink-2); }
.tray2.off .nudge, .tray2.off .ruler { opacity: 0.35; pointer-events: none; }
.tray2.noruler .ruler, .tray2.noruler .mark { display: none; }
.tray2.noruler.off .nudge { visibility: hidden; }
.tray2.noruler .hint { top: 196px; }
.status { display: block; margin: 10px auto 0; max-width: calc(100% - 48px); padding: 9px 16px; border-radius: 999px; background: #1c1c1e; font-size: 15px; line-height: 1.2; text-align: center; transition: transform 140ms var(--ease-out); }
.status:active { transform: scale(0.97); }
.status.live { box-shadow: inset 0 0 0 1.5px var(--accent); }
.timein { width: 112px; height: 44px; padding: 0 8px; border: 0; border-radius: 14px; background: #1c1c1e; color: var(--ink); font: inherit; font-size: 22px; text-align: center; color-scheme: dark; -webkit-user-select: text; user-select: text; }
.meta.tap { text-decoration: underline; text-decoration-color: #4a4a4e; text-underline-offset: 4px; cursor: pointer; }
.row.sel { background: none; }
.del { height: 36px; padding: 0 14px; margin: 0 0 10px 56px; border-radius: 999px; background: #2a1a1c; color: #ff6b6b; font-size: 14px; }
.stp { display: flex; align-items: center; justify-content: space-between; min-height: 84px; }
.stp b { display: block; font-size: 20px; font-weight: 500; }
.stp em { display: block; margin-top: 4px; font-style: normal; font-size: 13px; color: var(--ink-2); }
.step { display: flex; align-items: center; }
.step button { width: 44px; height: 44px; border-radius: 50%; background: var(--chip); font-size: 24px; font-weight: 300; line-height: 44px; transition: transform 140ms var(--ease-out); }
.step button:active { transform: scale(0.94); }
.step output { min-width: 88px; text-align: center; font-size: 26px; font-weight: 300; }

.field { display: block; padding: 10px 0; }
.field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--ink-2); }
.field input, .field select { width: 100%; height: 48px; padding: 0 14px; border: 0; border-radius: 14px; background: #1c1c1e; color: var(--ink); font: inherit; font-size: 17px; -webkit-user-select: text; user-select: text; color-scheme: dark; appearance: none; }
.field .hintt { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pill { display: block; width: 100%; height: 48px; margin-top: 22px; border-radius: 999px; background: #fff; color: #000; font-size: 17px; font-weight: 600; transition: transform 140ms var(--ease-out); }
.pill:active { transform: scale(0.97); }
.link { margin-top: 18px; height: 44px; padding: 0 18px; font-size: 15px; color: var(--ink-2); border-radius: 999px; }
.link:active { transform: scale(0.97); }

.value { display: flex; align-items: baseline; gap: 10px; }
.value .num { font-size: 96px; font-weight: 200; letter-spacing: -0.04em; line-height: 1; }
.value .unit { font-size: 26px; color: var(--ink-2); }
.value-input { width: 260px; background: none; border: 0; text-align: center; color: var(--ink); caret-color: var(--accent); font: inherit; font-size: 96px; font-weight: 200; letter-spacing: -0.04em; line-height: 1; -webkit-user-select: text; user-select: text; }
.cost { margin-top: 14px; font-size: 28px; font-weight: 300; }
.meta { margin-top: 6px; font-size: 15px; color: var(--ink-2); max-width: 320px; line-height: 1.35; }
.center .bar3 { width: 240px; }
.center .leg { width: 240px; }
.toast { color: var(--accent); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main class="phone" id="phone">
  <div class="probe" id="probe" style="position:absolute;visibility:hidden"></div>

  <!-- ===== Inicio ===== -->
  <section class="home" id="home" aria-label="Inicio">
    <p class="home-bar" id="topBar"></p>
    <button class="status" id="activeBar" hidden></button>
    <div class="stage"><h1 class="head" id="head" role="status" aria-live="polite"></h1></div>
    <div class="tray">
      <svg class="pointer" width="20" height="10" viewBox="0 0 20 10" aria-hidden="true"><path d="M0 0h20L10 10z" fill="#fff"/></svg>
      <div class="rail" id="rail"></div>
      <p class="hint">Tocá la ficha del centro</p>
    </div>
  </section>

  <!-- ===== Registrar carga ===== -->
  <section class="fn" id="fn-cargar" aria-label="Registrar carga" inert>
    <header class="fn-bar">
      <button class="icon" data-close aria-label="Cerrar"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 5l12 12M17 5L5 17"/></svg></button>
      <div class="seg" role="group" aria-label="Dónde cargaste" id="kindSeg">
        <button data-kind="home" aria-pressed="true">Casa</button>
        <button data-kind="public" aria-pressed="false">Pública</button>
      </div>
      <button class="icon" id="modeBtn" aria-label="Cargar por porcentaje de batería">%</button>
    </header>
    <div class="fn-body">
      <div class="center">
        <button class="value" id="valueBtn" aria-label="Escribir el valor exacto"><span class="num" id="valNum">25</span><span class="unit" id="valUnit">kWh</span></button>
        <input class="value-input" id="valInput" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="Valor" hidden>
        <button class="link" id="fromBtn" hidden style="margin-top:6px">Desde 20 %</button>
        <input class="from-in" id="fromInput" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="Batería al empezar, en porcentaje" hidden>
        <p class="cost" id="costLine"></p>
        <p class="meta" id="ctxLine" role="status" aria-live="polite"></p>
        <div id="kBar" style="display:contents"></div>
        <button class="link" id="detBtn">Detalles</button>
      </div>
      <div class="tray2">
        <svg class="pointer" width="20" height="10" viewBox="0 0 20 10" aria-hidden="true"><path d="M0 0h20L10 10z" fill="#fff"/></svg>
        <div class="dial">
          <button class="nudge l" data-n="-1" aria-label="Restar 1">−1</button>
          <button class="nudge s" data-n="-0.1" aria-label="Restar 0,1">−0,1</button>
          <button class="go" id="goBtn" aria-label="Guardar la carga"><span id="goVal">25,0</span></button>
          <button class="nudge s" data-n="0.1" aria-label="Sumar 0,1">+0,1</button>
          <button class="nudge l" data-n="1" aria-label="Sumar 1">+1</button>
        </div>
        <div class="ruler" id="ruler" tabindex="0" role="slider" aria-label="Valor de la carga" aria-valuemin="0" aria-valuemax="120" aria-valuenow="25"><div class="ruler-in" id="rulerIn"><div class="ticks" id="ticks"></div></div></div>
        <i class="mark" aria-hidden="true"></i>
        <p class="hint">Tocá el centro para guardar</p>
      </div>
    </div>
  </section>

  <section class="fn" id="fn-det" aria-label="Detalles de la carga" inert>
    <header class="fn-bar">
      <button class="icon" data-close aria-label="Volver"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 4l-7 7 7 7"/></svg></button>
      <h2>Detalles</h2><span></span>
    </header>
    <div class="fn-body"><div class="scroll"><div id="detForm"></div><button class="pill" data-close>Listo</button></div></div>
  </section>

  <!-- ===== Programar carga (asistente) ===== -->
  <section class="fn" id="fn-prog" aria-label="Programar carga" inert>
    <header class="fn-bar w">
      <button class="icon" id="wBack" aria-label="Atrás"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 4l-7 7 7 7"/></svg></button>
      <div class="dots" id="wDots" role="img"></div>
      <button class="icon txt" id="wSkip" hidden>Omitir</button>
    </header>
    <div class="fn-body">
      <div class="center">
        <p class="q" id="wQ" role="status" aria-live="polite"></p>
        <button class="value" id="wValue" aria-label="Escribir el valor exacto"><span class="num" id="wNum"></span><span class="unit" id="wUnit"></span></button>
        <input class="value-input" id="wInput" type="text" autocomplete="off" aria-label="Valor" hidden>
        <p class="meta" id="wCtx"></p>
        <div id="wBands" style="display:contents"></div>
        <div id="wExtra" class="wextra"></div>
      </div>
      <div class="tray2" id="wTray"></div>
    </div>
  </section>

  <!-- ===== Carga en curso ===== -->
  <section class="fn" id="fn-activa" aria-label="Carga en curso" inert>
    <header class="fn-bar">
      <button class="icon" data-close aria-label="Volver"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 4l-7 7 7 7"/></svg></button>
      <h2>Carga en curso</h2><span></span>
    </header>
    <div class="fn-body"><div class="scroll" id="activa"></div></div>
  </section>

  <!-- ===== Historial ===== -->
  <section class="fn" id="fn-historial" aria-label="Historial" inert>
    <header class="fn-bar">
      <button class="icon" data-close aria-label="Volver"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 4l-7 7 7 7"/></svg></button>
      <h2>Historial</h2><span></span>
    </header>
    <div class="fn-body"><div class="scroll" id="list"></div></div>
  </section>

  <!-- ===== Gasto ===== -->
  <section class="fn" id="fn-gasto" aria-label="Gasto" inert>
    <header class="fn-bar">
      <button class="icon" data-close aria-label="Volver"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 4l-7 7 7 7"/></svg></button>
      <h2 id="gTitle">Últimos 30 días</h2><span></span>
    </header>
    <div class="fn-body"><div class="scroll" id="gasto"></div></div>
  </section>

  <!-- ===== Autonomía ===== -->
  <section class="fn" id="fn-auto" aria-label="Autonomía" inert>
    <header class="fn-bar">
      <button class="icon" data-close aria-label="Volver"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 4l-7 7 7 7"/></svg></button>
      <h2>Autonomía</h2><span></span>
    </header>
    <div class="fn-body"><div class="scroll" id="auto"></div></div>
  </section>

  <!-- ===== Precios ===== -->
  <section class="fn" id="fn-precios" aria-label="Precios y tarifas" inert>
    <header class="fn-bar">
      <button class="icon" data-close aria-label="Volver"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 4l-7 7 7 7"/></svg></button>
      <h2>Precios y tarifas</h2><span></span>
    </header>
    <div class="fn-body"><div class="scroll" id="precios"></div></div>
  </section>
</main>

<script src="logic.js"></script>
<script>
(() => {
  'use strict';
  const L = CargaLogic;
  const $ = (s) => document.querySelector(s);
  const phone = $('#phone');

  /* ---------- Formato (es-UY) ---------- */
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const int = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const dec = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
  /** Número con coma decimal: entre `min` y `max` decimales (sin ceros de más). */
  function fmtNum(n, min, max) {
    const k = 10 ** max;
    const [i, f0 = ''] = (Math.round(n * k) / k).toFixed(max).split('.');
    let f = f0.replace(/0+$/, '');
    while (f.length < min) f += '0';
    return f ? `${i},${f}` : i;
  }
  const kwhTxt = (n) => fmtNum(n, 1, 2); // el cargador muestra hasta 2 decimales
  const pctTxt = (n) => fmtNum(n, 0, 1); // el % de batería, hasta 1 decimal
  const money = (n) => '$ ' + int(n);
  const money2 = (n) => '$ ' + dec(n, 2);
  const hhmm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const shortDate = (d) => `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const toInput = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}T${hhmm(d)}`;
  const num = (v) => parseFloat(String(v).replace(',', '.'));

  /* ---------- Estado y persistencia ---------- */
  const KEY = 'carga.v3';
  const DEFAULTS = () => ({
    vehicle: { name: 'GAC Aion UT Max', batteryKwh: 60, consumptionWhKm: 135 },
    rates: { ...L.UTE_2026_RATES }, puntaStart: L.DEFAULT_PUNTA_START, amps: 24, volts: 226, charges: [],
  });

  /** Datos de ejemplo coherentes (km, % de batería, horas, costos) generados con el mismo motor. */
  function makeSeed(now) {
    const B = 60, kw = L.chargerKw(24, 226), R = L.UTE_2026_RATES;
    const ute = L.groupNetworkRows(L.FALLBACK_NETWORK_ROWS).find((g) => g.key === 'UTE');
    const plan = [[58, 'home', 90, 22.5, 160], [52, 'home', 100, 23, 190], [46, 'public', 80, 13, 210], [41, 'home', 90, 22, 150],
      [35, 'home', 95, 23.5, 260], [30, 'home', 90, 21.5, 190], [24, 'home', 100, 23, 170], [19, 'public', 80, 12.5, 230],
      [13, 'home', 90, 22, 200], [8, 'home', 95, 23, 160], [4, 'home', 90, 22.5, 220], [2, 'home', 90, 23, 140]];
    let pct = 88, odo = 14230, id = 1;
    const out = [];
    for (const [ago, kind, target, hour, km] of plan) {
      odo += km;
      const startPct = Math.max(10, Math.round((pct - (km * 0.143 / B) * 100) * 10) / 10);
      const kwh = Math.round(L.kwhFromPct(startPct, target, B) * 100) / 100;
      const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ago);
      const base = { id: id++, odometerKm: odo, kwh, startPct, endPct: target, pricePerKwh: null, fixedFee: null, network: null, endAt: null };
      if (kind === 'home') {
        const start = new Date(day.getTime() + hour * 3600e3);
        const end = new Date(start.getTime() + L.minutesToDeliver(startPct, kwh, kw, B) * 60000);
        const r = L.computeHomeChargeCost(start, end, kwh, R, 19, { nominalKw: kw, startPct, batteryKwh: B });
        out.push({ ...base, location: 'home', startAt: start.toISOString(), endAt: end.toISOString(), cost: r.total, valleKwh: r.valleKwh, llanoKwh: r.llanoKwh, puntaKwh: r.puntaKwh });
      } else {
        const at = new Date(day.getTime() + hour * 3600e3), v = L.pickVariant(ute, at);
        out.push({ ...base, location: 'public', startAt: at.toISOString(), pricePerKwh: v.price, fixedFee: v.fee, network: v.empresa, cost: L.computePublicChargeCost(v.price, kwh, v.fee), valleKwh: 0, llanoKwh: 0, puntaKwh: 0 });
      }
      pct = target;
    }
    return out;
  }

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}
  if (!S || !Array.isArray(S.charges)) { S = DEFAULTS(); S.charges = makeSeed(new Date()); }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };

  const nominalKw = () => (S.amps > 0 && S.volts > 0 ? L.chargerKw(S.amps, S.volts) : 0);
  const homeCharges = () => S.charges.filter((c) => c.location === 'home');
  const calibration = () => L.computeCalibration(homeCharges(), nominalKw(), S.vehicle.batteryKwh);
  const consumption = () => { const real = L.realConsumption(S.charges, S.vehicle.batteryKwh); return { real, rc: L.rangeConsumption(S.vehicle, real) }; };

  /* ---------- Precios de redes públicas (en vivo → caché → resguardo) ---------- */
  const NET_URL = 'https://evuruguay.com/cargadores_all.csv', NET_KEY = 'carga.v3.redes';
  let net = { rows: L.FALLBACK_NETWORK_ROWS, source: 'base', at: null };
  async function loadNetworks() {
    try { const c = JSON.parse(localStorage.getItem(NET_KEY)); if (c && c.rows && c.rows.length) net = { rows: c.rows, source: 'guardado', at: c.at }; } catch (_) {}
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 4000);
      const res = await fetch(NET_URL, { signal: ctl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!res.ok) throw new Error(res.status);
      const rows = L.parseCsv(await res.text());
      if (!rows.length) throw new Error('vacío');
      net = { rows, source: 'en vivo', at: Date.now() };
      try { localStorage.setItem(NET_KEY, JSON.stringify({ rows, at: net.at })); } catch (_) {}
    } catch (_) { /* sin red: se queda con caché o resguardo */ }
    renderAll();
  }
  const groups = () => L.groupNetworkRows(net.rows);

  /* ---------- Fichas: carril con zoom central ---------- */
  const SLOT = 100;
  function makeRail(el, { count, html, label, onChange, onActivate }) {
    el.innerHTML = Array.from({ length: count }, (_, i) => `<button class="slot" data-i="${i}" aria-label="${label(i)}"><span class="c">${html(i)}</span></button>`).join('');
    const slots = [...el.children], discs = slots.map((s) => s.firstElementChild);
    let idx = -1, prog = false, timer = 0, raf = 0, md = null, dragged = false;
    const at = () => Math.max(0, Math.min(count - 1, Math.round(el.scrollLeft / SLOT)));
    function paint() {
      const c = el.scrollLeft;
      for (let i = 0; i < count; i++) {
        const k = Math.max(0, 1 - Math.abs(i * SLOT - c) / SLOT);
        discs[i].style.transform = `scale(${(0.52 + 0.48 * (k * k * (3 - 2 * k))).toFixed(3)})`;
        discs[i].style.setProperty('--k', k.toFixed(3));
        slots[i].style.zIndex = Math.round(k * 10);
      }
      const n = at();
      if (n !== idx) { idx = n; onChange(n, !prog); }
    }
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); };
    const onClick = (e) => {
      if (dragged) return;
      const s = e.target.closest('.slot'); if (!s) return;
      const i = +s.dataset.i;
      if (i === at()) onActivate(i); else go(i, true, true);
    };
    const onKey = (e) => {
      if (e.key === 'ArrowRight' && at() < count - 1) go(at() + 1, true, true);
      if (e.key === 'ArrowLeft' && at() > 0) go(at() - 1, true, true);
    };
    // arrastre con mouse (solo vista previa de escritorio)
    const onDown = (e) => { if (e.pointerType === 'mouse') md = { x: e.clientX, l: el.scrollLeft, moved: false }; };
    const onMove = (e) => {
      if (!md) return;
      const dx = e.clientX - md.x;
      if (!md.moved && Math.abs(dx) > 5) { md.moved = true; el.classList.add('mouse-drag'); }
      if (md.moved) el.scrollLeft = md.l - dx;
    };
    const onUp = () => {
      if (!md) return;
      const m = md; md = null;
      if (!m.moved) return;
      el.classList.remove('mouse-drag');
      dragged = true; setTimeout(() => (dragged = false), 0);
      el.scrollTo({ left: Math.round(el.scrollLeft / SLOT) * SLOT, behavior: 'smooth' });
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    el.addEventListener('click', onClick);
    el.addEventListener('keydown', onKey);
    el.addEventListener('pointerdown', onDown);
    addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    /** Quita todos los escuchadores: hay que llamarlo antes de reconstruir la bandeja sobre el mismo elemento. */
    function destroy() {
      cancelAnimationFrame(raf); clearTimeout(timer);
      el.removeEventListener('scroll', onScroll); el.removeEventListener('click', onClick);
      el.removeEventListener('keydown', onKey); el.removeEventListener('pointerdown', onDown);
      removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp);
    }
    /** `byUser`: el cambio de índice cuenta como acción del usuario (toque en una ficha lateral). */
    function go(i, smooth, byUser) {
      prog = !byUser; clearTimeout(timer);
      timer = setTimeout(() => (prog = false), smooth ? 700 : 80);
      el.scrollTo({ left: i * SLOT, behavior: smooth ? 'smooth' : 'instant' });
    }
    return { go, paint, destroy, get index() { return at(); }, relabel(fn) { discs.forEach((c, i) => (c.firstElementChild.textContent = fn(i))); } };
  }

  const ICONS = {
    cargar: '<path d="M13.5 3L5.5 14h6l-1 7 8-11h-6l1-7z"/>',
    prog: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
    historial: '<path d="M5 7h14M5 12h14M5 17h9"/>',
    gasto: '<path d="M5 19V10M12 19V5M19 19v-7"/>',
    auto: '<path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 14l3.5-4.5"/>',
    precios: '<path d="M4 12.5V5h7.5L20 13.5 13.5 20 4 12.5z"/><circle cx="8.2" cy="9.2" r="1.2"/>',
  };
  const FUNCS = [
    { id: 'cargar', name: 'Registrar carga', head: ['Registrar', 'carga'] },
    { id: 'prog', name: 'Programar carga', head: ['Programar', 'carga'] },
    { id: 'historial', name: 'Historial', head: ['Ver', 'historial'] },
    { id: 'gasto', name: 'Gasto', head: ['Cuánto', 'gasté'] },
    { id: 'auto', name: 'Autonomía', head: ['Mi', 'autonomía'] },
    { id: 'precios', name: 'Precios y tarifas', head: ['Precios', 'y tarifas'] },
  ];
  const homeRail = makeRail($('#rail'), {
    count: FUNCS.length,
    html: (i) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[FUNCS[i].id]}</svg>`,
    label: (i) => FUNCS[i].name,
    onChange: (i) => { $('#head').innerHTML = FUNCS[i].head.map((w) => `<span>${w}</span>`).join(''); },
    onActivate: (i) => openFn(FUNCS[i].id === 'prog' && S.active ? 'activa' : FUNCS[i].id),
  });

  /* ---------- Abrir y cerrar pantallas (pila) ---------- */
  const stack = [];
  function openFn(id, preset) {
    if (id === 'cargar') initCargar(preset);
    if (id === 'prog') initProg();
    renderAll();
    const el = $('#fn-' + id);
    el.inert = false; el.classList.add('open');
    (stack[stack.length - 1] ? $('#fn-' + stack[stack.length - 1]) : $('#home')).inert = true;
    stack.push(id);
    if (id === 'prog') renderProg();
    if (id === 'activa') { confirmShown = false; renderActiva(); }
    if (id === 'cargar') { buildRuler(); rulerTo(getVal()); }
  }
  function closeFn() {
    const id = stack.pop(); if (!id) return;
    const el = $('#fn-' + id);
    el.classList.remove('open'); el.inert = true;
    (stack[stack.length - 1] ? $('#fn-' + stack[stack.length - 1]) : $('#home')).inert = false;
  }
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeFn));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFn(); });

  /* ---------- Barra de franjas (Valle / Llano / Punta) ---------- */
  function bands(v, l, p) {
    const t = v + l + p;
    if (!(t > 0)) return '';
    const pc = (x) => Math.round((x / t) * 100);
    return `<div class="bar3" role="img" aria-label="Valle ${pc(v)}%, Llano ${pc(l)}%, Punta ${pc(p)}%"><i style="flex:${v};background:var(--accent)"></i><i style="flex:${l};background:#8e8e93"></i><i style="flex:${p};background:#fff"></i></div>`
      + `<div class="leg"><span>Valle ${pc(v)}%</span><span>Llano ${pc(l)}%</span><span>Punta ${pc(p)}%</span></div>`;
  }

  /* ================= Registrar carga ================= */
  const K = { kind: 'home', mode: 'kwh', kwh: 25, from: 20, to: 80, start: null, end: null, windowTouched: false, odo: '', netKey: '', varIdx: 0, price: '', fee: '', priceTouched: false, date: null };

  const r2 = (v) => Math.round(v * 100) / 100;
  const r1 = (v) => Math.round(v * 10) / 10;
  const kwhNow = () => (K.mode === 'kwh' ? K.kwh : r2(L.kwhFromPct(K.from, K.to, S.vehicle.batteryKwh) || 0));
  const getVal = () => (K.mode === 'kwh' ? K.kwh : K.to);
  const valTxt = () => (K.mode === 'kwh' ? kwhTxt(K.kwh) : pctTxt(K.to));
  const maxVal = () => (K.mode === 'kwh' ? 200 : 100);

  /** Cambia el valor activo (kWh o % final), con la precisión de cada uno: 2 decimales en kWh, 1 en %. */
  function setVal(v, fromRuler) {
    v = Math.min(maxVal(), Math.max(0.1, K.mode === 'kwh' ? r2(v) : r1(v)));
    if (K.mode === 'kwh') K.kwh = v; else K.to = v;
    recalc();
    if (!fromRuler) rulerTo(v);
  }

  /* ----- Regla deslizable: 80 px por unidad, marcas cada 0,1 ----- */
  const PX = 80;
  const ruler = $('#ruler');
  let rulerProg = false, rulerProgTimer = 0, snapTimer = 0;
  const rulerMax = () => (K.mode === 'kwh' ? 120 : 100);

  function buildRuler() {
    const w = ruler.clientWidth || 402, half = w / 2, max = rulerMax(), every = K.mode === 'kwh' ? 5 : 10;
    $('#rulerIn').style.width = `${max * PX + w + 2}px`;
    const t = $('#ticks');
    t.style.left = `${half}px`; t.style.width = `${max * PX + 2}px`;
    let labels = '';
    for (let n = 0; n <= max; n += every) labels += `<span style="left:${half + n * PX}px">${n}</span>`;
    $('#rulerIn').querySelectorAll('span').forEach((s) => s.remove());
    $('#rulerIn').insertAdjacentHTML('beforeend', labels);
    ruler.setAttribute('aria-valuemax', max);
  }
  function rulerTo(v) {
    rulerProg = true; clearTimeout(rulerProgTimer);
    rulerProgTimer = setTimeout(() => (rulerProg = false), 120);
    ruler.scrollTo({ left: Math.min(v, rulerMax()) * PX, behavior: 'instant' });
  }
  ruler.addEventListener('scroll', () => {
    if (rulerProg) return;
    setVal(r1(ruler.scrollLeft / PX), true);
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { if (!rulerProg) { rulerProg = true; ruler.scrollTo({ left: getVal() * PX, behavior: 'smooth' }); setTimeout(() => (rulerProg = false), 350); } }, 160);
  }, { passive: true });
  ruler.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 0.1, ArrowLeft: -0.1, PageUp: 1, PageDown: -1 }[e.key];
    if (d != null) { e.preventDefault(); setVal(getVal() + d); }
  });
  (function mouseDragRuler() {
    let md = null;
    ruler.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') md = { x: e.clientX, l: ruler.scrollLeft, moved: false }; });
    addEventListener('pointermove', (e) => {
      if (!md) return;
      const dx = e.clientX - md.x;
      if (!md.moved && Math.abs(dx) > 3) { md.moved = true; ruler.classList.add('mouse-drag'); }
      if (md.moved) ruler.scrollLeft = md.l - dx;
    });
    addEventListener('pointerup', () => { md = null; ruler.classList.remove('mouse-drag'); });
  })();

  /** Botones de ajuste fino: un toque suma un paso; mantenido, repite y acelera de a poco (x1, x2 a 1,5 s, x5 a 3 s). */
  function holdRepeat(btn, step) {
    let timer = 0, rep = 0;
    const stop = () => { clearTimeout(timer); clearInterval(rep); };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault(); stop(); step(1);
      const t0 = performance.now();
      timer = setTimeout(() => { rep = setInterval(() => { const held = performance.now() - t0; step(held > 3000 ? 5 : held > 1500 ? 2 : 1); }, 110); }, 420);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener('click', (e) => { if (e.detail === 0) step(1); }); // teclado
  }
  document.querySelectorAll('.nudge').forEach((b) => holdRepeat(b, (mult) => setVal(getVal() + Number(b.dataset.n) * mult)));
  $('#goBtn').addEventListener('click', () => saveCharge());

  function currentVariant() {
    const g = groups().find((x) => x.key === K.netKey);
    return g ? g.variants[Math.min(K.varIdx, g.variants.length - 1)] : null;
  }
  function pickNet(now) {
    const rank = L.rankNetworks(groups(), now, Math.max(kwhNow(), 1));
    const g = groups().find((x) => x.key === K.netKey) || groups().find((x) => x.key === 'UTE') || groups()[0];
    if (!g) return;
    K.netKey = g.key;
    const v = L.pickVariant(g, now);
    K.varIdx = Math.max(0, g.variants.indexOf(v));
    if (!K.priceTouched && v) { K.price = String(v.price); K.fee = String(v.fee); }
    return rank;
  }

  function homeWindow() {
    const now = new Date(), kwh = kwhNow(), kw = nominalKw();
    if (!K.windowTouched) {
      let mins = 120;
      if (kwh > 0 && kw > 0) mins = Math.max(10, K.mode === 'pct' ? L.minutesToDeliver(K.from, kwh, kw, S.vehicle.batteryKwh, calibration().factor) || 120 : Math.ceil((kwh / kw) * 60));
      K.end = now; K.start = new Date(now.getTime() - mins * 60000);
    }
    return { start: K.start, end: K.end };
  }

  /** Calcula el costo con el motor y actualiza la pantalla (nunca guarda un costo tipeado a mano). */
  function recalc() {
    const vt = valTxt();
    $('#valNum').textContent = vt;
    $('#valUnit').textContent = K.mode === 'kwh' ? 'kWh' : '%';
    const gv = $('#goVal'); gv.textContent = vt; gv.style.fontSize = `${vt.length <= 4 ? 46 : vt.length === 5 ? 38 : 32}px`;
    ruler.setAttribute('aria-valuenow', getVal()); ruler.setAttribute('aria-valuetext', `${vt} ${K.mode === 'kwh' ? 'kilovatios hora' : 'por ciento'}`);
    $('#fromBtn').hidden = K.mode !== 'pct' || !$('#fromInput').hidden; $('#fromBtn').textContent = `Desde ${pctTxt(K.from)} %`;
    const kwh = kwhNow(), cost = $('#costLine'), ctx = $('#ctxLine'), bar = $('#kBar');
    bar.innerHTML = '';
    let calc = null;
    try {
      if (K.kind === 'home') {
        const w = homeWindow();
        const r = L.computeHomeChargeCost(w.start, w.end, kwh, S.rates, S.puntaStart, { nominalKw: nominalKw(), calibration: calibration().factor, startPct: K.mode === 'pct' ? K.from : null, batteryKwh: S.vehicle.batteryKwh });
        calc = { cost: r.total, ...r };
        cost.textContent = money(r.total);
        ctx.textContent = `${kwhTxt(kwh)} kWh · de ${hhmm(w.start)} a ${hhmm(r.finishedAt)} · cambiar horario`;
        bar.innerHTML = bands(r.valleKwh, r.llanoKwh, r.puntaKwh);
      } else {
        const price = num(K.price), fee = num(K.fee) || 0;
        const total = L.computePublicChargeCost(price, kwh, fee);
        calc = { cost: total };
        cost.textContent = money(total);
        const v = currentVariant();
        ctx.textContent = `${kwhTxt(kwh)} kWh × ${money2(price)}${fee > 0 ? ` + ${money(fee)} fijo` : ''}${v ? ` · ${K.netKey}` : ''}`;
      }
    } catch (e) {
      cost.textContent = '$ 0';
      ctx.textContent = kwh > 0 ? e.message : K.mode === 'pct' ? 'El % final tiene que ser mayor al inicial.' : 'Elegí cuántos kWh cargaste.';
    }
    if (K.mode === 'pct' && kwh > 0) {
      // si ya hay odómetro, esta carga también entra al consumo real
      const odo = num(K.odo), pend = K.odo !== '' && isFinite(odo) ? { location: K.kind, startAt: new Date().toISOString(), odometerKm: odo, kwh, startPct: K.from, endPct: K.to } : null;
      const rc = L.rangeConsumption(S.vehicle, L.realConsumption(pend ? [...S.charges, pend] : S.charges, S.vehicle.batteryKwh));
      ctx.textContent += ` · terminás con ≈ ${L.rangeAtPct(S.vehicle.batteryKwh, rc.whKm, K.to)} km`;
    }
    ctx.classList.toggle('tap', K.kind === 'home'); // el horario se cambia tocando esta línea
    $('#modeBtn').textContent = K.mode === 'kwh' ? '%' : 'kWh';
    $('#modeBtn').setAttribute('aria-label', K.mode === 'kwh' ? 'Cargar por porcentaje de batería' : 'Cargar por kWh');
    K.calc = calc;
  }

  /** Valores de partida a partir del historial: la última carga y el % de inicio típico. */
  function initCargar(preset) {
    const sorted = [...S.charges].sort((a, b) => new Date(b.startAt) - new Date(a.startAt));
    const starts = S.charges.filter((c) => c.startPct != null).map((c) => c.startPct);
    K.kind = 'home'; K.mode = 'kwh'; K.windowTouched = false;
    K.kwh = sorted[0] ? r1(sorted[0].kwh) : 25;
    K.to = sorted[0] && sorted[0].endPct != null ? sorted[0].endPct : 80;
    K.from = starts.length ? r1(starts.reduce((a, b) => a + b, 0) / starts.length) : 20;
    K.odo = ''; K.priceTouched = false; K.date = null; K.netKey = '';
    if (preset) Object.assign(K, preset); // p. ej. desde "Cuándo empezar": % de inicio/fin y odómetro
    document.querySelectorAll('#kindSeg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.kind === 'home'));
    recalc();
  }

  document.querySelectorAll('#kindSeg button').forEach((b) => b.addEventListener('click', () => {
    K.kind = b.dataset.kind;
    document.querySelectorAll('#kindSeg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    if (K.kind === 'public') pickNet(new Date());
    recalc();
  }));
  $('#modeBtn').addEventListener('click', () => {
    K.mode = K.mode === 'kwh' ? 'pct' : 'kwh'; K.windowTouched = false;
    buildRuler(); recalc(); rulerTo(getVal());
  });

  /* Tocar el número abre el teclado decimal: valor exacto (hasta 2 decimales en kWh, 1 en %). */
  const valueBtn = $('#valueBtn'), valInput = $('#valInput');
  valueBtn.addEventListener('click', () => { valueBtn.hidden = true; valInput.hidden = false; valInput.value = valTxt(); valInput.focus(); valInput.select(); });
  function commitInput() {
    if (valInput.hidden) return;
    const v = num(valInput.value);
    valInput.hidden = true; valueBtn.hidden = false;
    if (isFinite(v) && v > 0) setVal(v); else recalc();
  }
  valInput.addEventListener('blur', commitInput);
  valInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') valInput.blur(); });

  /* En modo % también se puede escribir el % de inicio exacto. */
  const fromBtn = $('#fromBtn'), fromInput = $('#fromInput');
  fromBtn.addEventListener('click', () => { fromBtn.hidden = true; fromInput.hidden = false; fromInput.value = pctTxt(K.from); fromInput.focus(); fromInput.select(); });
  function commitFrom() {
    if (fromInput.hidden) return;
    const v = num(fromInput.value);
    fromInput.hidden = true;
    if (isFinite(v) && v >= 0 && v < 100) { K.from = r1(v); K.windowTouched = false; }
    recalc();
  }
  fromInput.addEventListener('blur', commitFrom);
  fromInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fromInput.blur(); });

  /* ----- Detalles de la carga ----- */
  const field = (id, label, input, hint = '') => `<div class="field"><label for="${id}">${label}</label>${input}${hint ? `<p class="hintt">${hint}</p>` : ''}</div>`;
  function renderDetails() {
    let h = '';
    if (K.kind === 'home') {
      const w = homeWindow();
      h += `<div class="pair">${field('d-start', 'Empezó', `<input id="d-start" type="datetime-local" value="${toInput(w.start)}">`)}${field('d-end', 'Terminó', `<input id="d-end" type="datetime-local" value="${toInput(w.end)}">`)}</div>`;
    } else {
      pickNet(new Date());
      const g = groups().find((x) => x.key === K.netKey), v = currentVariant();
      h += field('d-net', 'Red', `<select id="d-net">${groups().map((x) => `<option value="${x.key}" ${x.key === K.netKey ? 'selected' : ''}>${x.key}</option>`).join('')}</select>`);
      if (g && g.variants.length > 1) h += field('d-var', 'Variante / franja', `<select id="d-var">${g.variants.map((x, i) => `<option value="${i}" ${i === K.varIdx ? 'selected' : ''}>${x.label}</option>`).join('')}</select>`);
      h += `<div class="pair">${field('d-price', 'Precio $/kWh', `<input id="d-price" inputmode="decimal" value="${K.price}">`, v ? `Sugerido ${money2(v.price)} (${net.source})` : '')}${field('d-fee', 'Cargo fijo $', `<input id="d-fee" inputmode="decimal" value="${K.fee}">`)}</div>`;
      h += field('d-date', 'Fecha y hora', `<input id="d-date" type="datetime-local" value="${toInput(K.date || new Date())}">`);
    }
    if (K.mode === 'pct') h += field('d-from', 'Batería al empezar (%)', `<input id="d-from" inputmode="decimal" value="${K.from}">`);
    h += field('d-odo', 'Odómetro (km, opcional)', `<input id="d-odo" inputmode="numeric" value="${K.odo}">`, 'Con el odómetro se calcula tu consumo real.');
    $('#detForm').innerHTML = h;
  }
  $('#detBtn').addEventListener('click', () => { renderDetails(); openFn('det'); });
  $('#ctxLine').addEventListener('click', () => { if (K.kind === 'home') { renderDetails(); openFn('det'); } });
  $('#detForm').addEventListener('input', (e) => {
    const id = e.target.id, v = e.target.value;
    if (id === 'd-start' || id === 'd-end') {
      const d = new Date(v); if (isNaN(d)) return;
      if (id === 'd-start') K.start = d; else K.end = d;
      K.windowTouched = true;
    } else if (id === 'd-net') {
      K.netKey = v; K.priceTouched = false;
      const g = groups().find((x) => x.key === v);
      K.varIdx = Math.max(0, g.variants.indexOf(L.pickVariant(g, new Date())));
      pickNetKeep(); renderDetails();
    }
    else if (id === 'd-var') { K.varIdx = +v; K.priceTouched = false; const x = currentVariant(); if (x) { K.price = String(x.price); K.fee = String(x.fee); } renderDetails(); }
    else if (id === 'd-price') { K.price = v; K.priceTouched = true; }
    else if (id === 'd-fee') { K.fee = v; K.priceTouched = true; }
    else if (id === 'd-date') { const d = new Date(v); if (!isNaN(d)) K.date = d; }
    else if (id === 'd-from') { const n = num(v); if (isFinite(n)) { K.from = r1(Math.max(0, Math.min(99.9, n))); K.windowTouched = false; } }
    else if (id === 'd-odo') K.odo = v;
    recalc();
  });
  function pickNetKeep() { const x = currentVariant(); if (x) { K.price = String(x.price); K.fee = String(x.fee); } }

  let saving = false;
  function saveCharge() {
    const kwh = kwhNow();
    if (!(kwh > 0) || !K.calc || saving) return;
    saving = true; setTimeout(() => (saving = false), 800); // un doble toque no guarda dos veces
    const odo = K.odo !== '' && isFinite(num(K.odo)) ? num(K.odo) : null;
    const base = { id: Date.now(), kwh, odometerKm: odo, startPct: K.mode === 'pct' ? K.from : null, endPct: K.mode === 'pct' ? K.to : null, pricePerKwh: null, fixedFee: null, network: null, endAt: null };
    try {
      let c;
      if (K.kind === 'home') {
        const w = homeWindow();
        const r = L.computeHomeChargeCost(w.start, w.end, kwh, S.rates, S.puntaStart, { nominalKw: nominalKw(), calibration: calibration().factor, startPct: base.startPct, batteryKwh: S.vehicle.batteryKwh });
        c = { ...base, location: 'home', startAt: w.start.toISOString(), endAt: r.finishedAt.toISOString(), cost: r.total, valleKwh: r.valleKwh, llanoKwh: r.llanoKwh, puntaKwh: r.puntaKwh };
      } else {
        const price = num(K.price), fee = num(K.fee) || 0, v = currentVariant();
        c = { ...base, location: 'public', startAt: (K.date || new Date()).toISOString(), pricePerKwh: price, fixedFee: fee, network: v ? v.empresa : K.netKey || 'Otro', cost: L.computePublicChargeCost(price, kwh, fee), valleKwh: 0, llanoKwh: 0, puntaKwh: 0 };
      }
      S.charges.push(c); persist();
      while (stack.length) closeFn();
      renderAll();
      flash(`Carga guardada · ${money(c.cost)}`);
    } catch (e) { $('#ctxLine').textContent = e.message; }
  }

  let flashTimer = 0;
  function flash(msg) {
    const bar = $('#topBar'); clearTimeout(flashTimer);
    bar.innerHTML = `<span class="toast">${msg}</span>`;
    flashTimer = setTimeout(renderTop, 2800);
  }

  /* ================= Programar carga: asistente paso a paso ================= */
  const GAP = 0.5; // % mínimo entre el inicio y el objetivo
  const wrap = (n) => ((n % 1440) + 1440) % 1440;
  const mm = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
  /** "23:30", "2330" o "930" → minutos desde la medianoche; null si no es una hora. */
  function parseClock(s) {
    s = String(s).trim();
    let h, m;
    if (s.includes(':')) [h, m] = s.split(':').map(Number);
    else { const d = s.replace(/\D/g, ''); if (d.length < 3 || d.length > 4) return null; h = Number(d.slice(0, -2)); m = Number(d.slice(-2)); }
    return h >= 0 && h < 24 && m >= 0 && m < 60 ? h * 60 + m : null;
  }
  /** Próxima vez que el reloj marca `min`, siempre posterior a `after` (mismo criterio que el repo original). */
  function nextAt(min, base, after) {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, min);
    if (d <= after) d.setDate(d.getDate() + 1);
    return d;
  }
  const fmtDur = (mins) => { mins = Math.max(0, Math.round(mins)); const h = Math.floor(mins / 60), m = mins % 60; return h ? `${h} h ${m} min` : `${m} min`; };

  /**
   * Dial reutilizable (círculo central + ajuste fino + regla). `cfg` describe el valor: { get, set, seed, min, max,
   * step, ppv (px por unidad), major, every, nudges: [[delta, texto, aria] x4], label(), tick(n), noRuler, onChange }.
   */
  function makeDial(tray, onGo) {
    tray.innerHTML = '<svg class="pointer" width="20" height="10" viewBox="0 0 20 10" aria-hidden="true"><path d="M0 0h20L10 10z" fill="#fff"/></svg>'
      + '<div class="dial"><button class="nudge l p0"></button><button class="nudge s p1"></button><button class="go"><span class="goval"></span></button><button class="nudge s p2"></button><button class="nudge l p3"></button></div>'
      + '<div class="ruler" tabindex="0" role="slider"><div class="ruler-in"><div class="ticks"></div></div></div><i class="mark" aria-hidden="true"></i><p class="hint"></p>';
    const $$ = (s) => tray.querySelector(s);
    const ruler = $$('.ruler'), ticks = $$('.ticks'), rin = $$('.ruler-in'), goV = $$('.goval'), goBtn = $$('.go'), hint = $$('.hint');
    const nbs = [...tray.querySelectorAll('.nudge')];
    let cfg = null, prog = false, progT = 0, snapT = 0;

    const cur = () => (cfg.get() ?? cfg.seed);
    function toRuler(v) {
      prog = true; clearTimeout(progT); progT = setTimeout(() => (prog = false), 140);
      ruler.scrollTo({ left: Math.min(Math.max(v, 0), cfg.max) * cfg.ppv, behavior: 'instant' });
    }
    function sync(moveRuler) {
      const t = cfg.label();
      goV.textContent = t; goV.style.fontSize = `${t.length <= 4 ? 46 : t.length === 5 ? 38 : t.length <= 7 ? 30 : 24}px`;
      if (moveRuler && !cfg.noRuler) toRuler(cur());
      ruler.setAttribute('aria-valuenow', cur());
    }
    function config(c, hintText) {
      cfg = c; hint.textContent = hintText;
      tray.classList.toggle('noruler', !!c.noRuler);
      if (!c.noRuler) {
        const w = ruler.clientWidth || 402, half = w / 2;
        rin.style.width = `${c.max * c.ppv + w + 2}px`;
        ticks.style.cssText = `left:${half}px;width:${c.max * c.ppv + 2}px;--minor:${c.step * c.ppv}px;--major:${c.major * c.ppv}px`;
        let labels = '';
        for (let n = 0; n <= c.max; n += c.every) labels += `<span style="left:${half + n * c.ppv}px">${c.tick(n)}</span>`;
        rin.querySelectorAll('span').forEach((s) => s.remove());
        rin.insertAdjacentHTML('beforeend', labels);
        ruler.setAttribute('aria-valuemin', 0); ruler.setAttribute('aria-valuemax', c.max); ruler.setAttribute('aria-label', c.aria || 'Valor');
      }
      nbs.forEach((b, i) => { b.textContent = c.nudges[i][1]; b.setAttribute('aria-label', c.nudges[i][2] || c.nudges[i][1]); });
      sync(true);
    }
    function apply(v) { cfg.set(v); sync(true); cfg.onChange(); }
    ruler.addEventListener('scroll', () => {
      if (prog || !cfg || cfg.noRuler) return;
      const v = Math.min(cfg.max, Math.round(ruler.scrollLeft / cfg.ppv / cfg.step) * cfg.step);
      cfg.set(cfg.step < 1 ? r1(v) : v); sync(false); cfg.onChange();
      clearTimeout(snapT);
      snapT = setTimeout(() => { prog = true; ruler.scrollTo({ left: cur() * cfg.ppv, behavior: 'smooth' }); setTimeout(() => (prog = false), 350); }, 160);
    }, { passive: true });
    ruler.addEventListener('keydown', (e) => {
      const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      if (d != null && cfg) { e.preventDefault(); apply(cur() + d * cfg.step); }
    });
    nbs.forEach((b, i) => holdRepeat(b, (mult) => { const d = cfg.nudges[i][0]; apply(cur() + d * (cfg.kind === 'num' ? mult : 1)); }));
    goBtn.addEventListener('click', () => onGo());
    (function mouseDrag() { // solo vista previa de escritorio
      let md = null;
      ruler.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') md = { x: e.clientX, l: ruler.scrollLeft, moved: false }; });
      addEventListener('pointermove', (e) => {
        if (!md) return;
        const dx = e.clientX - md.x;
        if (!md.moved && Math.abs(dx) > 3) { md.moved = true; ruler.classList.add('mouse-drag'); }
        if (md.moved) ruler.scrollLeft = md.l - dx;
      });
      addEventListener('pointerup', () => { md = null; ruler.classList.remove('mouse-drag'); });
    })();
    return {
      config, sync, apply,
      setEnabled(on) { tray.classList.toggle('off', !on); nbs.forEach((b) => (b.disabled = !on)); ruler.tabIndex = on ? 0 : -1; },
      setHint(t) { hint.textContent = t; },
    };
  }

  /* ----- Estado del asistente ----- */
  const W = { step: 0, from: 20, stopMin: 7 * 60, goal: null, later: false, startMin: 23 * 60, odo: null };
  const STEPS = [
    { id: 'from', q: '¿Con cuánta batería enchufás?' },
    { id: 'stop', q: '¿A qué hora cortás?' },
    { id: 'goal', q: '¿Hasta cuánta batería querés llegar?', optional: true },
    { id: 'start', q: '¿Cuándo empieza?' },
    { id: 'odo', q: '¿Cuál es el odómetro?', optional: true },
    { id: 'sum', q: 'Todo listo' },
  ];
  const lastOdo = () => { const c = S.charges.filter((x) => x.odometerKm != null).sort((a, b) => new Date(b.startAt) - new Date(a.startAt))[0]; return c ? c.odometerKm : null; };
  const setPct = (v) => r1(Math.max(0, Math.min(99.5, v)));

  /** Cómo se ve cada pregunta en el dial: qué valor edita, con qué pasos y cómo se muestra. */
  function stepCfg(id) {
    const pct = { kind: 'num', min: 0, max: 100, step: 0.1, ppv: 80, major: 1, every: 10, tick: String, nudges: [[-1, '−1', 'Restar 1'], [-0.1, '−0,1', 'Restar 0,1'], [0.1, '+0,1', 'Sumar 0,1'], [1, '+1', 'Sumar 1']] };
    const clock = { kind: 'time', min: 0, max: 1435, step: 5, ppv: 80 / 60, major: 60, every: 120, tick: (n) => String(n / 60).padStart(2, '0'), nudges: [[-60, '−1 h', 'Una hora antes'], [-15, '−15', '15 minutos antes'], [15, '+15', '15 minutos después'], [60, '+1 h', 'Una hora después']] };
    if (id === 'from') return { ...pct, aria: 'Batería al enchufar', get: () => W.from, set: (v) => { W.from = setPct(v); }, seed: W.from, label: () => pctTxt(W.from) };
    if (id === 'goal') return { ...pct, aria: 'Objetivo de batería', get: () => W.goal, set: (v) => { W.goal = r1(Math.max(W.from + GAP, Math.min(100, v))); }, seed: Math.max(80, W.from + GAP), label: () => (W.goal == null ? 'Omitir' : pctTxt(W.goal)) };
    if (id === 'stop') return { ...clock, aria: 'Hora de corte', get: () => W.stopMin, set: (v) => { W.stopMin = wrap(v); }, seed: W.stopMin, label: () => mm(W.stopMin) };
    if (id === 'start') return { ...clock, aria: 'Hora de inicio', get: () => W.startMin, set: (v) => { W.startMin = wrap(v); }, seed: W.startMin, label: () => (W.later ? mm(W.startMin) : 'Ahora') };
    if (id === 'odo') return { kind: 'num', noRuler: true, aria: 'Odómetro', get: () => W.odo, set: (v) => { W.odo = Math.max(0, Math.round(v)); }, seed: lastOdo() || 0, label: () => (W.odo == null ? 'Omitir' : int(W.odo)), nudges: [[-10, '−10'], [-1, '−1'], [1, '+1'], [10, '+10']] };
    return null;
  }

  const dial = makeDial($('#wTray'), () => wizNext());

  /** Valores de partida: % de inicio típico del historial; si hay una carga programada, sus datos. */
  function initProg() {
    const starts = S.charges.filter((c) => c.startPct != null).map((c) => c.startPct);
    Object.assign(W, { step: 0, from: starts.length ? r1(starts.reduce((a, b) => a + b, 0) / starts.length) : 20, stopMin: 7 * 60, goal: null, later: false, startMin: 23 * 60, odo: null });
    const a = S.active;
    if (a) {
      const st = new Date(a.startAt), sp = new Date(a.stopAt);
      Object.assign(W, { from: a.startPct, later: a.mode === 'scheduled', startMin: st.getHours() * 60 + st.getMinutes(), stopMin: sp.getHours() * 60 + sp.getMinutes(), goal: a.goal, odo: a.odo });
    }
  }

  /** Plan con los datos cargados hasta ahora. `later` = si el inicio es a una hora fija o ahora. */
  function planCalc(now, later) {
    const B = S.vehicle.batteryKwh, kw = nominalKw(), calib = calibration().factor;
    const start = later ? nextAt(W.startMin, now, now) : now;
    const stop = nextAt(W.stopMin, start, start);
    const est = L.estimateAtTime(W.from, start, stop, kw, B, calib);
    const cost = est.kwhDelivered > 0.01
      ? L.computeHomeChargeCost(start, stop, est.kwhDelivered, S.rates, S.puntaStart, { nominalKw: kw, calibration: calib, startPct: W.from, batteryKwh: B }) : null;
    return { B, kw, calib, start, stop, est, cost };
  }
  /** Mejor hora de inicio para llegar al objetivo cortando a la hora de salida (casi todo en Valle). */
  function bestStart(now) {
    if (W.goal == null || !(nominalKw() > 0)) return null;
    return L.suggestStart({ fromPct: W.from, toPct: W.goal, deadline: nextAt(W.stopMin, now, now), nominalKw: nominalKw(), batteryKwh: S.vehicle.batteryKwh, calibration: calibration().factor, rates: S.rates, puntaStart: S.puntaStart, altStart: now });
  }

  /** Autonomía con el odómetro (opcional): suma el tramo desde la última carga al consumo real. */
  function autoLine(now, endPct, kwh) {
    const B = S.vehicle.batteryKwh, has = W.odo != null;
    const prev = S.charges.filter((c) => c.odometerKm != null).sort((a, b) => new Date(b.startAt) - new Date(a.startAt))[0];
    let list = S.charges, seg = '';
    if (has) {
      if (prev && W.odo <= prev.odometerKm) seg = `El odómetro tiene que ser mayor al de tu última carga (${int(prev.odometerKm)} km).`;
      else {
        list = [...S.charges, { location: 'home', startAt: now.toISOString(), odometerKm: W.odo, kwh, startPct: W.from, endPct }];
        const km = prev ? W.odo - prev.odometerKm : 0, used = prev && prev.endPct != null ? ((prev.endPct - W.from) / 100) * B : 0;
        if (prev && km >= 10 && used > 0) seg = ` Desde tu última carga: ${dec((used / km) * 100, 1)} kWh/100 km en ${int(km)} km.`;
      }
    }
    const rc = L.rangeConsumption(S.vehicle, L.realConsumption(list, B));
    return { km: L.rangeAtPct(B, rc.whKm, endPct), text: seg };
  }

  /* ----- Pantalla del asistente ----- */
  const wInput = $('#wInput'), wValue = $('#wValue');
  const cur = () => STEPS[W.step];

  function wizRender() {
    const st = cur(), c = stepCfg(st.id);
    $('#wQ').textContent = st.q;
    $('#wDots').innerHTML = STEPS.map((_, i) => `<i class="${i < W.step ? 'done' : i === W.step ? 'on' : ''}"></i>`).join('');
    $('#wDots').setAttribute('aria-label', `Paso ${W.step + 1} de ${STEPS.length}`);
    $('#wSkip').hidden = !st.optional;
    wInput.hidden = true; wValue.hidden = !c;
    $('#wExtra').innerHTML = '';
    if (st.id === 'start') {
      $('#wExtra').innerHTML = `<div class="seg wide" role="group" aria-label="Cuándo empieza" id="wSeg"><button data-later="0" aria-pressed="${!W.later}">Ahora</button><button data-later="1" aria-pressed="${W.later}">Más tarde</button></div>`;
    }
    if (c) {
      c.onChange = wizUpdate;
      dial.config(c, 'Tocá el centro para continuar');
      dial.setEnabled(st.id !== 'start' || W.later);
    } else {
      dial.config({ kind: 'num', noRuler: true, max: 0, step: 1, ppv: 1, major: 1, every: 1, tick: String, nudges: [[0, ''], [0, ''], [0, ''], [0, '']], get: () => 0, seed: 0, set() {}, label: () => 'Programar', onChange() {} }, 'Tocá el centro para programar');
      dial.setEnabled(false);
    }
    wizUpdate();
  }

  /** Actualiza número grande, línea de contexto y barra de franjas según el paso y los valores. */
  function wizUpdate() {
    const st = cur(), now = new Date(), B = S.vehicle.batteryKwh, ctx = $('#wCtx');
    $('#wBands').innerHTML = '';
    const set = (num, unit = '') => { $('#wNum').textContent = num; $('#wUnit').textContent = unit; };
    if (st.id === 'from') {
      const rc = L.rangeConsumption(S.vehicle, L.realConsumption(S.charges, B));
      set(pctTxt(W.from), '%'); ctx.textContent = `≈ ${L.rangeAtPct(B, rc.whKm, W.from)} km de autonomía ahora`;
    } else if (st.id === 'stop') {
      const p = planCalc(now, false);
      set(mm(W.stopMin));
      ctx.textContent = p.cost ? `Si empezás ahora llegás a ≈ ${pctTxt(p.est.pct)}% · ${kwhTxt(p.est.kwhDelivered)} kWh · ${money(p.cost.total)}` : '';
    } else if (st.id === 'goal') {
      set(W.goal == null ? '—' : pctTxt(W.goal), W.goal == null ? '' : '%');
      ctx.textContent = W.goal == null ? 'Opcional: con un objetivo te digo a qué hora empezar.' : `${kwhTxt(L.kwhFromPct(W.from, W.goal, B) || 0)} kWh a cargar`;
    } else if (st.id === 'start') {
      const p = planCalc(now, W.later), s = bestStart(now);
      set(W.later ? mm(W.startMin) : 'Ahora');
      ctx.textContent = p.cost ? `≈ ${pctTxt(p.est.pct)}% a las ${mm(W.stopMin)} · ${kwhTxt(p.est.kwhDelivered)} kWh · ${money(p.cost.total)}` : '';
      if (p.cost) $('#wBands').innerHTML = bands(p.cost.valleKwh, p.cost.llanoKwh, p.cost.puntaKwh);
      if (s && s.start > now) {
        const m = s.start.getHours() * 60 + s.start.getMinutes();
        $('#wExtra').querySelector('.sug')?.remove();
        $('#wExtra').insertAdjacentHTML('beforeend', `<p class="note sug">Para llegar a ${pctTxt(W.goal)}%, lo mejor es empezar a las ${mm(m)} (${Math.round(s.valleShare * 100)}% en Valle, ${money(s.best.total)}).${W.later && W.startMin === m ? '' : ` <button class="link inl-link" id="useSug" data-m="${m}">Usar esa hora</button>`}</p>`);
      }
    } else if (st.id === 'odo') {
      const p = planCalc(now, W.later), a = autoLine(now, W.goal ?? p.est.pct, p.est.kwhDelivered);
      set(W.odo == null ? '—' : int(W.odo), W.odo == null ? '' : 'km');
      ctx.textContent = W.odo == null ? 'Opcional: con el odómetro se afina tu consumo real y la autonomía.' : `Autonomía al terminar ≈ ${a.km} km. ${a.text}`;
    } else {
      wizSummary(now);
    }
    // el círculo central muestra el valor (o "Omitir" si el dato es opcional y está vacío)
    const c = stepCfg(st.id); if (c) dial.sync(false);
  }

  function wizSummary(now) {
    const p = planCalc(now, W.later), B = S.vehicle.batteryKwh, end = W.goal ?? p.est.pct, a = autoLine(now, end, p.est.kwhDelivered);
    $('#wNum').textContent = ''; $('#wUnit').textContent = '';
    $('#wCtx').textContent = '';
    const row = (l, v, em = '') => `<div class="kv"><span>${l}${em ? `<em>${em}</em>` : ''}</span><b>${v}</b></div>`;
    $('#wExtra').innerHTML = row('Empieza', W.later ? `${hhmm(p.start)}` : 'Ahora', W.later ? '' : 'en cuanto confirmes')
      + row('Corta', hhmm(p.stop)) + row('Batería', `${pctTxt(W.from)}% → ≈ ${pctTxt(p.est.pct)}%`, W.goal != null ? `objetivo ${pctTxt(W.goal)}%` : '')
      + row('Energía', `${kwhTxt(p.est.kwhDelivered)} kWh`) + (p.cost ? row('Costo estimado', money(p.cost.total), `${Math.round((p.cost.valleKwh / p.est.kwhDelivered) * 100)}% en Valle`) : '')
      + row('Autonomía', `≈ ${a.km} km`, W.odo != null ? `odómetro ${int(W.odo)} km` : '');
  }

  /* ----- Navegación ----- */
  function wizNext() {
    if (cur().id === 'sum') { scheduleCharge(); return; }
    if (cur().id === 'odo' && W.odo != null) { // un odómetro menor al anterior no sirve
      const prev = lastOdo();
      if (prev != null && W.odo <= prev) { $('#wCtx').textContent = `Tiene que ser mayor al de tu última carga (${int(prev)} km).`; return; }
    }
    advance();
  }
  /** Pasa al paso siguiente. Al entrar a "Cuándo empieza" con un objetivo, propone la hora sugerida (todo en Valle). */
  function advance() {
    W.step++;
    if (cur().id === 'start') {
      const s = bestStart(new Date());
      if (s && s.start > new Date()) { W.later = true; W.startMin = s.start.getHours() * 60 + s.start.getMinutes(); }
    }
    wizRender();
  }
  $('#wBack').addEventListener('click', () => { if (W.step > 0) { W.step--; wizRender(); } else closeFn(); });
  $('#wSkip').addEventListener('click', () => { if (cur().id === 'goal') W.goal = null; if (cur().id === 'odo') W.odo = null; advance(); });
  $('#wExtra').addEventListener('click', (e) => {
    const s = e.target.closest('[data-later]'), u = e.target.closest('#useSug');
    if (s) { W.later = s.dataset.later === '1'; document.querySelectorAll('#wSeg button').forEach((b) => b.setAttribute('aria-pressed', (b.dataset.later === '1') === W.later)); dial.setEnabled(W.later); dial.sync(true); wizUpdate(); }
    else if (u) { W.later = true; W.startMin = Number(u.dataset.m); document.querySelectorAll('#wSeg button').forEach((b) => b.setAttribute('aria-pressed', (b.dataset.later === '1') === W.later)); dial.setEnabled(true); dial.sync(true); wizUpdate(); }
  });

  /* Tocar el número grande abre el teclado para escribir el valor exacto. */
  wValue.addEventListener('click', () => {
    const st = cur(), c = stepCfg(st.id); if (!c) return;
    wInput.inputMode = c.kind === 'time' ? 'numeric' : 'decimal';
    wInput.placeholder = c.kind === 'time' ? 'HH:MM' : '';
    wInput.value = c.get() == null ? '' : c.kind === 'time' ? mm(c.get()) : c.noRuler ? String(c.get()) : kwhTxt(c.get()).replace(',0', '');
    wValue.hidden = true; wInput.hidden = false; wInput.focus(); wInput.select();
  });
  function wizCommit() {
    if (wInput.hidden) return;
    const c = stepCfg(cur().id), raw = wInput.value;
    wInput.hidden = true; wValue.hidden = false;
    if (!c) return;
    const v = c.kind === 'time' ? parseClock(raw) : num(raw);
    if (v != null && isFinite(v)) { if (cur().id === 'start') W.later = true; c.set(v); dial.sync(true); }
    if (cur().id === 'start') { document.querySelectorAll('#wSeg button').forEach((b) => b.setAttribute('aria-pressed', (b.dataset.later === '1') === W.later)); dial.setEnabled(true); }
    wizUpdate();
  }
  wInput.addEventListener('blur', wizCommit);
  wInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') wInput.blur(); });

  function renderProg() { wizRender(); }

  /** Crea la carga activa: "Ahora" arranca a contar ya; "Más tarde" queda en espera hasta la hora de inicio. */
  function scheduleCharge() {
    const now = new Date();
    if (!isFinite(W.from) || !(nominalKw() > 0)) { $('#wCtx').textContent = 'Configurá tu cargador en Autonomía.'; return; }
    const start = W.later ? nextAt(W.startMin, now, now) : now, stop = nextAt(W.stopMin, start, start);
    S.active = { mode: W.later ? 'scheduled' : 'live', startAt: start.toISOString(), stopAt: stop.toISOString(), startPct: W.from, goal: W.goal, odo: W.odo };
    confirmAt = null; confirmShown = false; persist();
    closeFn(); renderStatus(); tick();
    flash(W.later ? `Programada · empieza a las ${hhmm(start)}` : `Cargando desde ${pctTxt(W.from)}%`);
  }

  /* ----- Carga en curso: en espera, cargando, a confirmar ----- */
  let confirmAt = null, confirmShown = false, confirmEnd = null;
  function activeInfo(now) {
    const a = S.active, B = S.vehicle.batteryKwh, kw = nominalKw(), calib = calibration().factor;
    const start = new Date(a.startAt), stop = new Date(a.stopAt);
    const st = confirmAt ? 'ended' : now < start ? 'waiting' : now < stop ? 'charging' : 'ended';
    const est = (to) => L.estimateAtTime(a.startPct, start, to, kw, B, calib);
    const cost = (kwh, to) => (kwh > 0.01 && to > start ? L.computeHomeChargeCost(start, to, kwh, S.rates, S.puntaStart, { nominalKw: kw, calibration: calib, startPct: a.startPct, batteryKwh: B }) : null);
    return { a, st, start, stop, B, kw, calib, est, cost };
  }

  function renderStatus() {
    const bar = $('#activeBar'), a = S.active;
    if (!a) { bar.hidden = true; return; }
    const now = new Date(), I = activeInfo(now);
    bar.hidden = false; bar.classList.toggle('live', I.st === 'charging');
    if (I.st === 'waiting') bar.textContent = `Programada · arranca en ${fmtDur((I.start - now) / 60000)}`;
    else if (I.st === 'charging') bar.textContent = `Cargando · ≈ ${pctTxt(I.est(now).pct)}% · corta ${hhmm(I.stop)}`;
    else bar.textContent = 'Terminó · confirmá tu carga';
  }
  $('#activeBar').addEventListener('click', () => openFn('activa'));

  function renderActiva() {
    const box = $('#activa'), a = S.active;
    if (!a) { box.innerHTML = '<p class="note">No hay ninguna carga programada.</p>'; confirmShown = false; return; }
    const now = new Date(), I = activeInfo(now);
    if (I.st === 'ended') { if (!confirmShown) { renderConfirm(I); confirmShown = true; } return; }
    confirmShown = false;
    if (I.st === 'waiting') {
      const eStop = I.est(I.stop), c = I.cost(eStop.kwhDelivered, I.stop);
      box.innerHTML = `<div class="hero2"><p class="big" style="font-size:min(56px,14vw)">${fmtDur((I.start - now) / 60000)}</p><p class="sub">arranca a las ${hhmm(I.start)} · corta a las ${hhmm(I.stop)}</p><p class="find">Desde ${pctTxt(a.startPct)}%. Al corte ≈ ${pctTxt(eStop.pct)}% (${kwhTxt(eStop.kwhDelivered)} kWh).</p></div>`
        + (c ? `<div class="kv"><span>Costo estimado</span><b>${money(c.total)}</b></div>${bands(c.valleKwh, c.llanoKwh, c.puntaKwh)}` : '')
        + `<button class="pill" id="aNow">Empezar ahora</button><button class="link" id="aEdit">Cambiar horarios</button><button class="link" id="aCancel">Cancelar programación</button>`;
    } else {
      const e = I.est(now), eStop = I.est(I.stop), c = I.cost(e.kwhDelivered, now);
      box.innerHTML = `<div class="hero2"><p class="big">≈ ${pctTxt(e.pct)}<small>%</small></p><p class="sub">${kwhTxt(e.kwhDelivered)} kWh hasta ahora · corta a las ${hhmm(I.stop)}</p><p class="find">Al corte ≈ ${pctTxt(eStop.pct)}% (${kwhTxt(eStop.kwhDelivered)} kWh). Desde ${pctTxt(a.startPct)}% a las ${hhmm(I.start)}.</p></div>`
        + (c ? `<div class="kv"><span>Costo hasta ahora</span><b>${money(c.total)}</b></div>` : '')
        + `<button class="pill" id="aFinish">Terminar ahora</button><button class="link" id="aCancel">Cancelar carga</button>`;
    }
  }

  /** La carga se guarda recién acá, con lo real: % final, kWh (se recalculan del %) y odómetro. */
  function renderConfirm(I) {
    confirmEnd = confirmAt || I.stop;
    const e = I.est(confirmEnd), odo = I.a.odo != null ? I.a.odo : '';
    $('#activa').innerHTML = `<div class="hero2"><p class="sub">Terminó la carga</p><p class="find">Estimado ≈ ${pctTxt(e.pct)}% · ${kwhTxt(e.kwhDelivered)} kWh. Confirmá lo real.</p></div>`
      + field('c-pct', '% final real', `<input id="c-pct" inputmode="decimal" autocomplete="off" value="${pctTxt(e.pct)}">`)
      + field('c-kwh', 'kWh reales', `<input id="c-kwh" inputmode="decimal" autocomplete="off" value="${kwhTxt(e.kwhDelivered)}">`, 'Se calcula del % (batería × diferencia). Cambialo si el cargador marcó otro valor.')
      + field('c-odo', 'Odómetro (km, opcional)', `<input id="c-odo" inputmode="decimal" autocomplete="off" value="${odo}">`)
      + `<p class="note" id="c-err" style="color:var(--warn)"></p><button class="pill" id="cSave">Guardar carga</button><button class="link" id="cDiscard">Descartar</button>`;
  }

  $('#activa').addEventListener('input', (e) => {
    if (e.target.id !== 'c-pct' || !S.active) return;
    const v = num(e.target.value);
    if (isFinite(v)) $('#c-kwh').value = kwhTxt(Math.max(0, r2(((v - S.active.startPct) / 100) * S.vehicle.batteryKwh)));
  });
  $('#activa').addEventListener('click', (e) => {
    const id = e.target.id, a = S.active;
    if (!a) return;
    if (id === 'aNow') { a.startAt = new Date().toISOString(); a.mode = 'live'; persist(); renderActiva(); renderStatus(); }
    else if (id === 'aEdit') { closeFn(); openFn('prog'); }
    else if (id === 'aCancel') { if (confirm('¿Cancelar esta carga?')) { S.active = null; persist(); renderStatus(); closeFn(); } }
    else if (id === 'aFinish') { confirmAt = new Date(); confirmShown = false; renderActiva(); renderStatus(); }
    else if (id === 'cDiscard') { if (confirm('¿Descartar esta carga sin guardarla?')) { S.active = null; confirmAt = null; confirmShown = false; persist(); renderStatus(); closeFn(); } }
    else if (id === 'cSave') saveActive();
  });

  function saveActive() {
    const a = S.active, err = $('#c-err'), pct = num($('#c-pct').value), kwh = num($('#c-kwh').value), odoRaw = $('#c-odo').value.trim(), odo = num(odoRaw);
    if (!isFinite(pct) || pct < 0 || pct > 100) { err.textContent = 'Ingresá un % final válido (0 a 100).'; return; }
    if (!isFinite(kwh) || kwh <= 0) { err.textContent = 'Los kWh reales tienen que ser mayores a cero.'; return; }
    try {
      const start = new Date(a.startAt);
      const r = L.computeHomeChargeCost(start, confirmEnd, r2(kwh), S.rates, S.puntaStart, { nominalKw: nominalKw(), calibration: calibration().factor, startPct: a.startPct, batteryKwh: S.vehicle.batteryKwh });
      S.charges.push({ id: Date.now(), location: 'home', startAt: start.toISOString(), endAt: r.finishedAt.toISOString(), kwh: r2(kwh), odometerKm: odoRaw !== '' && isFinite(odo) ? odo : null, startPct: a.startPct, endPct: r1(pct), pricePerKwh: null, fixedFee: null, network: null, cost: r.total, valleKwh: r.valleKwh, llanoKwh: r.llanoKwh, puntaKwh: r.puntaKwh });
      S.active = null; confirmAt = null; confirmShown = false; persist();
      while (stack.length) closeFn();
      renderAll(); renderStatus();
      flash(`Carga guardada · ${money(r.total)}`);
    } catch (e) { err.textContent = e.message; }
  }

  function tick() {
    renderStatus();
    if (S.active && stack[stack.length - 1] === 'activa') renderActiva();
  }
  setInterval(tick, 1000);

  /* ================= Historial / Gasto / Autonomía / Precios ================= */
  let hFilter = 'all', hSel = null;
  function renderList() {
    const sorted = [...S.charges].filter((c) => hFilter === 'all' || c.location === hFilter).sort((a, b) => new Date(b.startAt) - new Date(a.startAt));
    const gs = new Map();
    for (const c of sorted) { const m = MONTHS[new Date(c.startAt).getMonth()]; if (!gs.has(m)) gs.set(m, []); gs.get(m).push(c); }
    const li = (c) => {
      const d = new Date(c.startAt);
      const where = c.location === 'home' ? `Casa · ${c.kwh > 0 ? `Valle ${Math.round((c.valleKwh / c.kwh) * 100)}%` : ''}` : (c.network || 'Pública');
      const pct = c.startPct != null && c.endPct != null ? ` · ${pctTxt(c.startPct)}→${pctTxt(c.endPct)}%` : '';
      return `<li class="row" data-id="${c.id}" role="button" tabindex="0" aria-expanded="${hSel === c.id}"><span class="d">${shortDate(d)}</span><span><b>${kwhTxt(c.kwh)} kWh</b><i>${where}${pct}</i></span><span class="c">${money(c.cost)}</span></li>${hSel === c.id ? `<li><button class="del" data-del="${c.id}">Eliminar esta carga</button></li>` : ''}`;
    };
    const seg = `<div class="seg wide" role="group" aria-label="Filtrar">${[['all', 'Todas'], ['home', 'Casa'], ['public', 'Pública']].map(([k, l]) => `<button data-hf="${k}" aria-pressed="${hFilter === k}">${l}</button>`).join('')}</div>`;
    $('#list').innerHTML = seg + ([...gs].map(([m, rows]) => `<p class="month">${cap(m)}</p><ul>${rows.map(li).join('')}</ul>`).join('') || '<p class="note">No hay cargas para mostrar.</p>');
  }
  $('#list').addEventListener('click', (e) => {
    const f = e.target.closest('[data-hf]'), d = e.target.closest('[data-del]'), row = e.target.closest('.row');
    if (f) { hFilter = f.dataset.hf; hSel = null; renderList(); }
    else if (d) { if (confirm('¿Eliminar esta carga? No se puede deshacer.')) { S.charges = S.charges.filter((c) => c.id !== Number(d.dataset.del)); hSel = null; persist(); renderAll(); } }
    else if (row) { hSel = hSel === Number(row.dataset.id) ? null : Number(row.dataset.id); renderList(); }
  });

  let gPeriod = '30d';
  const DAY = 864e5;
  /** Período del resumen: 30 días corridos (vs los 30 anteriores) o mes calendario (vs el mismo tramo del mes anterior). */
  function period(now) {
    const end = new Date(now.getTime() + 1);
    if (gPeriod === 'mes') {
      const from = L.startOfMonth(now), c = L.compareToPrevMonth(S.charges, now);
      return { from, end, cmp: c, vs: `el mismo tramo de ${MONTHS[L.startOfMonth(now, 1).getMonth()]}` };
    }
    const from = new Date(now.getTime() - 30 * DAY), prev = L.statsBetween(S.charges, new Date(now.getTime() - 60 * DAY), from).total;
    const cur = L.statsBetween(S.charges, from, end).total;
    return { from, end, cmp: { cur, prev, deltaPct: prev > 0 ? ((cur - prev) / prev) * 100 : null }, vs: 'los 30 días anteriores' };
  }

  function renderGasto() {
    const now = new Date(), p = period(now), cmp = p.cmp;
    const s = L.statsBetween(S.charges, p.from, p.end);
