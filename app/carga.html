<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carga">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>Carga</title>
<style>
:root {
  --bg: color-mix(in srgb, var(--bgk, #000) calc(var(--bgt, 0) * 14%), #000); --chip: #262629; --ink: #fff; --ink-2: #a3a3aa; --accent: #4fb58a; --warn: #e5a93b;
  --floor: color-mix(in srgb, color-mix(in srgb, var(--bgk, #000) calc(var(--bgt, 0) * 24%), #0b0b0b) 82%, var(--bg)); /* la bandeja de vidrio ya compuesta sobre el fondo */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); overscroll-behavior: none; }
body { display: grid; place-items: center; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; font-variant-numeric: tabular-nums; -webkit-touch-callout: none; }
* { touch-action: pan-x pan-y; } /* sin zoom por gestos: es una app, no una página. Los contenedores con scroll cortan la herencia, por eso va en todos */
[hidden] { display: none !important; } /* si no, las reglas display de las clases pisan el atributo hidden */
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
ul { list-style: none; }

/* ---------- App ---------- */
/* Ocupa toda la pantalla: fija a los cuatro bordes (no 100dvh, que en iOS a pantalla completa deja una franja abajo). En una pantalla ancha (escritorio, tablet) queda una columna centrada del ancho de un iPhone grande, sin marco. */
.app { position: fixed; inset: 0; margin: 0 auto; width: 100%; max-width: 440px; overflow: hidden; background: var(--bg);
  /* En la app instalada de iOS (fitLower): arriba queda libre la zona de la isla dinámica (--lower) y abajo termina donde iOS deja de dibujar (--lower-b); los márgenes seguros ya están contados ahí (--env-on: 0). */
  top: var(--lower, 0px); bottom: var(--lower-b, 0px);
  --safe-top: calc(env(safe-area-inset-top, 0px) * var(--env-on, 1)); --safe-bottom: calc(env(safe-area-inset-bottom, 0px) * var(--env-on, 1)); --tray-shift: 0px; }
@media (min-width: 600px) { body { background: #0b0b0b; } }
/* Respaldo: si algo de la app quedara fuera de la página en el iPhone (la página mide 781 de 874 pt), la franja de abajo toma el color de la bandeja en el inicio y los asistentes. */
@media (max-width: 599px) {
  html.floor, html.floor body { background-color: var(--floor); }
  html.floor body { background-image: linear-gradient(var(--bg), var(--bg)); background-size: 100% var(--lower, 0px); background-repeat: no-repeat; } /* taste-skill-ignore: un color plano para la franja de arriba, no un degradé */
}
/* Material translúcido tintado: superficies grandes (--glass), contenedores sobre ellas (--glass-in) y el elegido (--glass-hi).
   Cada uno es el tinte del fondo sobre un gris casi negro, con transparencia: dejan ver la textura y siguen al color de la ficha. */
.app, .home {
  --glass: color-mix(in srgb, color-mix(in srgb, var(--bgk, #000) calc(var(--bgt, 0) * 24%), #0b0b0b) 82%, transparent);
  --glass-in: color-mix(in srgb, color-mix(in srgb, var(--bgk, #000) calc(var(--bgt, 0) * 22%), #1c1c1e) 70%, transparent);
  --glass-hi: color-mix(in srgb, color-mix(in srgb, var(--bgk, #000) calc(var(--bgt, 0) * 28%), #2c2c2f) 85%, transparent);
}

/* ---------- Fondo: tinte plano (14 % del color de la ficha), textura y ondas ----------
   Todo es plano y se mueve solo con transform y opacity. El tinte y la textura siguen al carril (--bgk, --tx);
   las ondas salen de la ficha activa. Quietas con «Reducir movimiento» o cuando hay otra pantalla encima. */
.bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-tint { position: absolute; inset: 0; background: color-mix(in srgb, var(--bgk, #000) calc(var(--bgt, 0) * 14%), #000); }
.bg-tex { position: absolute; top: 0; bottom: 0; left: -40px; right: -40px; background: var(--tex, none) center / auto no-repeat; will-change: transform; }
.bg-rings i { position: absolute; left: 50%; bottom: calc(152px + var(--safe-bottom) - 520px - var(--tray-shift)); width: 1040px; height: 1040px; margin-left: -520px; border-radius: 50%;
  border: 1.5px solid var(--bgk, var(--accent)); opacity: 0; transform: scale(0.12); will-change: transform, opacity; animation: wave 9s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
.bg-rings i:nth-child(2) { animation-delay: -3s; }
.bg-rings i:nth-child(3) { animation-delay: -6s; }
.app.live .bg-rings i { animation-duration: 5s; }
.app.fn-open .bg-rings i { animation-play-state: paused; }
.app.still .bg-rings i { animation: none; }
@keyframes wave { 0% { transform: scale(0.12); opacity: 0; } 8% { opacity: 0.26; } 100% { transform: scale(1); opacity: 0; } }

/* ---------- Inicio ---------- */
.home { position: absolute; inset: 0; display: flex; flex-direction: column; }
.home-bar { padding: calc(var(--safe-top) + 14px) 24px 0; text-align: center; font-size: 17px; min-height: calc(var(--safe-top) + 44px); }
.home-bar span { color: var(--ink-2); }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px calc(238px + var(--safe-bottom)); }
.head { font-size: min(56px, 14vw); font-weight: 300; letter-spacing: -0.035em; line-height: 1.06; text-align: center; }
.head span { display: block; }
.tray, .tray2 { position: relative; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 44px 44px 0 0; height: calc(262px + var(--safe-bottom)); flex: none; }
.tray { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; }
.pointer { position: absolute; top: calc(22px + var(--tray-shift)); left: 50%; margin-left: -10px; }
.rail { position: absolute; top: calc(40px + var(--tray-shift)); left: 0; right: 0; height: 140px; display: flex; align-items: center; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: none; -webkit-overflow-scrolling: touch; }
.rail::-webkit-scrollbar { display: none; }
.rail::before, .rail::after { content: ""; flex: 0 0 calc(50% - 50px); }
.rail.mouse-drag { scroll-snap-type: none; cursor: grabbing; }
/* el círculo (126 px) es más ancho que su espacio (100 px): se centra desde su punto medio, no con la alineación de la grilla, que lo pegaba al borde izquierdo */
.slot { position: relative; flex: none; width: 100px; height: 140px; scroll-snap-align: center; } /* sin scroll-snap-stop: con «always» el carril frenaba en seco en cada ficha apenas se soltaba el dedo */
.slot .c { --k: 0; position: absolute; left: 50%; top: 50%; margin: -63px 0 0 -63px; width: 126px; height: 126px; border-radius: 50%; display: block; will-change: transform;
  color: color-mix(in srgb, #fff calc(var(--k) * 100%), #a0a0a5); }
/* Ficha de poker: cuerpo, marcas del borde y anillo van del gris al color elegido a medida que la ficha llega al centro (--k) */
.chip { display: block; width: 100%; height: 100%; overflow: visible; }
.chip .body { fill: color-mix(in srgb, var(--cc, var(--accent)) calc(var(--k, 1) * 100%), var(--chip)); }
.chip .tx { fill: none; stroke: color-mix(in srgb, var(--ce, #fff) calc(var(--k, 1) * 100%), #4a4a4e); opacity: calc(0.5 - var(--k, 1) * 0.18); }
.chip .mk { fill: none; stroke: color-mix(in srgb, var(--ce, #fff) calc(var(--k, 1) * 100%), #3a3a3d); }
.chip .rim { fill: none; stroke: rgba(255, 255, 255, calc(0.06 + var(--k, 1) * 0.16)); stroke-width: 2; }
.chip .ring { fill: none; stroke: color-mix(in srgb, var(--ce, #fff) calc(var(--k, 1) * 70%), #3a3a3d); stroke-width: 1.5; }
.chip .ic { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
/* Dial de valor exacto: círculo central + ajuste fino + regla */
.dial { position: absolute; top: 40px; left: 0; right: 0; height: 126px; }
.go { position: absolute; left: 50%; top: 0; width: 126px; height: 126px; margin-left: -63px; border-radius: 50%; background: var(--go, var(--accent)); color: #fff;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.22); display: grid; place-items: center; font-weight: 300; letter-spacing: -0.02em; transition: transform 140ms var(--ease-out); }
.go:active { transform: scale(0.97); }
.nudge { position: absolute; border-radius: 50%; background: var(--glass-in); color: #c7c7cc; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06); display: grid; place-items: center; font-size: 16px; transition: transform 140ms var(--ease-out); }
.nudge:active { transform: scale(0.94); }
.nudge.s { width: 56px; height: 56px; top: 35px; }
.nudge.l { width: 48px; height: 48px; top: 39px; font-size: 15px; color: var(--ink-2); }
.nudge[data-n="-0.1"] { left: max(8px, calc(50% - 129px)); }
.nudge[data-n="-1"] { left: max(8px, calc(50% - 187px)); }
.nudge[data-n="0.1"] { left: calc(50% + 73px); }
.nudge[data-n="1"] { left: calc(50% + 139px); }
.ruler { position: absolute; top: 182px; left: 0; right: 0; height: 44px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: none; -webkit-overflow-scrolling: touch; cursor: grab; }
.ruler::-webkit-scrollbar { display: none; }
.ruler.mouse-drag { cursor: grabbing; }
.ruler-in { position: relative; height: 44px; }
.ticks { --px: 80px; position: absolute; bottom: 14px; height: 16px; background-image: linear-gradient(90deg, #55555a 1px, transparent 1px), linear-gradient(90deg, #a0a0a5 1.5px, transparent 1.5px); background-size: var(--minor, 8px) 8px, var(--major, 80px) 16px; background-repeat: repeat-x; background-position: left bottom; } /* taste-skill-ignore: marcas de 1 px de la regla, no un degradé decorativo */
.ruler-in span { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 12px; color: var(--ink-2); }
.mark { position: absolute; top: 182px; left: 50%; width: 2px; height: 30px; margin-left: -1px; border-radius: 1px; background: var(--accent); pointer-events: none; }
.tray2 .hint { top: 234px; }
.inl { width: 4.2ch; text-align: center; background: var(--glass-in); border: 0; border-radius: 8px; color: var(--ink); font: inherit; font-size: 17px; padding: 2px 4px; margin: 0 2px; -webkit-user-select: text; user-select: text; }
.from-in { width: 160px; background: none; border: 0; text-align: center; color: var(--ink); caret-color: var(--accent); font: inherit; font-size: 28px; font-weight: 300; -webkit-user-select: text; user-select: text; }
.hint { position: absolute; top: 196px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--ink-2); }
.tray .hint { top: calc(196px + var(--tray-shift)); }

/* ---------- Funciones ---------- */
.fn { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--bg) var(--tex, none) calc(50% + var(--tx, 0px)) 50% / auto no-repeat; opacity: 0; visibility: hidden; transform: translateY(20px);
  transition: opacity 200ms var(--ease-out), transform 240ms var(--ease-out), visibility 0s 240ms; }
.fn.open { opacity: 1; visibility: visible; transform: none; transition: opacity 220ms var(--ease-out), transform 360ms var(--ease-drawer), visibility 0s; }
#fn-det { z-index: 50; }
.fn-bar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(var(--safe-top) + 8px) 16px 0; flex: none; }
.fn-bar h2 { font-size: 17px; font-weight: 600; text-align: center; }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); font-size: 15px; font-weight: 500; transition: transform 140ms var(--ease-out); }
.icon:active { transform: scale(0.94); }
.icon svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fn-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px 24px; text-align: center; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 24px calc(var(--safe-bottom) + 28px); }
.scroll::-webkit-scrollbar { display: none; }
.hero2 { padding: 28px 0 8px; text-align: center; }
.big { font-size: min(72px, 18vw); font-weight: 300; letter-spacing: -0.04em; line-height: 1; }
.big .cur { font-size: 0.46em; margin-right: 0.1em; color: var(--ink-2); letter-spacing: 0; vertical-align: top; position: relative; top: 0.12em; }
.big small { font-size: 0.34em; margin-left: 0.12em; color: var(--ink-2); letter-spacing: 0; font-weight: 400; }
.sub { margin-top: 14px; font-size: 17px; }
.find { margin: 8px auto 0; max-width: 300px; font-size: 15px; line-height: 1.35; color: var(--ink-2); text-wrap: balance; }
h3 { margin: 30px 0 4px; font-size: 13px; font-weight: 400; color: var(--ink-2); }
.kv { display: flex; justify-content: space-between; align-items: baseline; min-height: 48px; padding: 12px 0; font-size: 17px; gap: 16px; }
.kv span { color: var(--ink-2); font-size: 15px; }
.kv em { display: block; margin-top: 3px; font-style: normal; font-size: 13px; color: var(--ink-2); }
.kv b { font-weight: 500; text-align: right; }
.note { padding: 14px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }

.bar3 { display: flex; gap: 2px; height: 6px; margin: 14px 0 8px; border-radius: 3px; overflow: hidden; }
.bar3 i { display: block; min-width: 2px; }
.leg { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }


.seg { position: relative; display: flex; padding: 3px; border-radius: 999px; background: var(--glass-in); justify-self: center; touch-action: pan-y; }
.seg button { position: relative; z-index: 1; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 15px; color: var(--ink-2); transition: background-color 160ms ease, color 160ms ease; white-space: nowrap; }
.seg button::before { content: ""; position: absolute; inset: -4px 0; }
.seg:not(.has-thumb) button[aria-pressed="true"] { background: var(--glass-hi); }
.seg button[aria-pressed="true"], .seg button.hot { color: var(--ink); }
/* Globo de cristal: marca la opción elegida, se agranda al apretarlo y se puede arrastrar hasta otra opción (lo mueve JS: segSync) */
.seg .thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; pointer-events: none;
  background: rgba(255, 255, 255, 0.13); -webkit-backdrop-filter: blur(6px) saturate(1.6); backdrop-filter: blur(6px) saturate(1.6);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.16);
  translate: var(--x, 0px) 0; transition: translate 380ms var(--ease-drawer), width 260ms var(--ease-drawer), scale 240ms var(--ease-out), background-color 200ms var(--ease-out), box-shadow 240ms var(--ease-out); }
.seg .thumb.press { scale: 1.1 1.22; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 8px 20px rgba(0, 0, 0, 0.35); }
.seg .thumb.drag { transition: width 200ms var(--ease-out), scale 240ms var(--ease-out), background-color 200ms var(--ease-out), box-shadow 240ms var(--ease-out); }
.seg.wide { display: flex; margin-top: 18px; }
.seg.wide button { flex: 1; padding: 0 4px; }

/* Asistente: una pregunta por pantalla con el mismo dial de Registrar */
.fn-bar.w { grid-template-columns: 64px 1fr 64px; }
.icon.txt { width: auto; padding: 0 10px; border-radius: 999px; justify-self: end; }
.dots { display: flex; gap: 7px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: #3a3a3c; transition: background-color 200ms var(--ease-out), width 200ms var(--ease-out); }
.dots i.done { background: var(--accent); }
.dots i.on { width: 18px; background: var(--ink); }
.q { max-width: 300px; margin-bottom: 14px; font-size: 20px; font-weight: 500; line-height: 1.25; text-wrap: balance; }
.wextra { width: 100%; max-width: 340px; max-height: 300px; overflow-y: auto; scrollbar-width: none; }
.wextra::-webkit-scrollbar { display: none; }
.choices { display: grid; gap: 10px; width: 100%; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choice { min-height: 60px; padding: 12px 14px; border-radius: 16px; background: var(--glass-in); text-align: left; transition: transform 140ms var(--ease-out); }
.choice:active { transform: scale(0.98); }
.choice b { display: block; font-size: 17px; font-weight: 500; }
.choice em { display: block; margin-top: 3px; font-style: normal; font-size: 13px; line-height: 1.3; color: var(--ink-2); }
.choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.wextra .kv { text-align: left; }
.inl-link { margin: 0; height: 32px; padding: 0 6px; color: var(--accent); }
.nudge.p0 { left: max(8px, calc(50% - 187px)); width: 48px; height: 48px; top: 39px; font-size: 15px; color: var(--ink-2); }
.nudge.p1 { left: max(8px, calc(50% - 129px)); width: 56px; height: 56px; top: 35px; }
.nudge.p2 { left: calc(50% + 73px); width: 56px; height: 56px; top: 35px; }
.nudge.p3 { left: calc(50% + 139px); width: 48px; height: 48px; top: 39px; font-size: 15px; color: var(--ink-2); }
.tray2.off .nudge, .tray2.off .ruler { opacity: 0.35; pointer-events: none; }
.tray2.noruler .ruler, .tray2.noruler .mark { display: none; }
.tray2.noruler.off .nudge { visibility: hidden; }
.tray2.noruler .hint { top: 196px; }
.status { display: block; margin: 10px auto 0; max-width: calc(100% - 48px); padding: 9px 16px; border-radius: 999px; background: var(--glass-in); font-size: 15px; line-height: 1.2; text-align: center; transition: transform 140ms var(--ease-out); }
.status:active { transform: scale(0.97); }
.status.live { box-shadow: inset 0 0 0 1.5px var(--accent); }
.draft { margin: 10px auto 0; width: calc(100% - 48px); padding: 12px 16px 4px; border-radius: 18px; background: var(--glass-in); }
.draft p { font-size: 15px; font-weight: 500; }
.draft .ds { margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--ink-2); }
.draft .da { display: flex; gap: 20px; }
.draft .da button { min-height: 44px; padding: 0; font-size: 15px; color: var(--accent); }
.draft .da button + button { color: var(--ink-2); }
.timein { width: 112px; height: 44px; padding: 0 8px; border: 0; border-radius: 14px; background: var(--glass-in); color: var(--ink); font: inherit; font-size: 22px; text-align: center; color-scheme: dark; -webkit-user-select: text; user-select: text; }
.stp { display: flex; align-items: center; justify-content: space-between; min-height: 84px; }
.stp b { display: block; font-size: 20px; font-weight: 500; }
.stp em { display: block; margin-top: 4px; font-style: normal; font-size: 13px; color: var(--ink-2); }
.step { display: flex; align-items: center; }
.step button { width: 44px; height: 44px; border-radius: 50%; background: var(--glass-in); font-size: 24px; font-weight: 300; line-height: 44px; transition: transform 140ms var(--ease-out); }
.step button:active { transform: scale(0.94); }
.step output { min-width: 88px; text-align: center; font-size: 26px; font-weight: 300; }

.field { display: block; padding: 10px 0; }
.field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--ink-2); }
.field input, .field select { width: 100%; height: 48px; padding: 0 14px; border: 0; border-radius: 14px; background: var(--glass-in); color: var(--ink); font: inherit; font-size: 17px; -webkit-user-select: text; user-select: text; color-scheme: dark; appearance: none; }
.field .hintt { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pill { display: block; width: 100%; height: 48px; margin-top: 22px; border-radius: 999px; background: #fff; color: #000; font-size: 17px; font-weight: 600; transition: transform 140ms var(--ease-out); }
.pill:active { transform: scale(0.97); }
.link { margin-top: 18px; height: 44px; padding: 0 18px; font-size: 15px; color: var(--ink-2); border-radius: 999px; }
.link:active { transform: scale(0.97); }

.value { display: flex; align-items: baseline; gap: 10px; }
.value .num { font-size: 96px; font-weight: 200; letter-spacing: -0.04em; line-height: 1; }
.value .unit { font-size: 26px; color: var(--ink-2); }
.value-input { width: 260px; background: none; border: 0; text-align: center; color: var(--ink); caret-color: var(--accent); font: inherit; font-size: 96px; font-weight: 200; letter-spacing: -0.04em; line-height: 1; -webkit-user-select: text; user-select: text; }
.cost { margin-top: 14px; font-size: 28px; font-weight: 300; }
.meta { margin-top: 6px; font-size: 15px; color: var(--ink-2); max-width: 320px; line-height: 1.35; }
.center .bar3 { width: 240px; }
.center .leg { width: 240px; }
.toast { color: var(--accent); }

/* Historial: calendario (todo con alcance #hist) */
#hist, #dayHud { --valle: #4fb58a; --llano: #8e8e93; --punta: #fff; --line: #1a1a1a; }
#hist .hh { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 20px calc(var(--hud-h, 0px) + var(--safe-bottom) + 24px); }
#hist .hh::-webkit-scrollbar { display: none; }
#hist .hsub { margin-top: 2px; font-size: 14px; line-height: 1.3; color: var(--ink-2); }
#hist .hsub b { font-weight: 500; color: var(--ink); }
#hist .htabs { display: flex; gap: 22px; margin-top: 8px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
#hist .htabs button { height: 44px; margin-bottom: -1px; }
#hist .htabs button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
#hist .hscroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 20px calc(var(--safe-bottom) + 24px); }
#hist .hscroll::-webkit-scrollbar { display: none; }
#hist .legend { display: flex; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
#hist .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: -0.5px; }
#hist .legend .l1::before { background: var(--valle); } #hist .legend .l2::before { background: var(--llano); } #hist .legend .l3::before { background: var(--punta); } #hist .legend .l4::before { box-shadow: inset 0 0 0 1.5px var(--llano); }
:is(#hist, #dayHud) .stackh { display: flex; gap: 1px; height: 100%; width: 100%; }
:is(#hist, #dayHud) .stackh i, :is(#hist, #dayHud) .stackv i { display: block; min-width: 1px; }
:is(#hist, #dayHud) .stackv { display: flex; flex-direction: column-reverse; gap: 1px; width: 100%; height: 100%; }
:is(#hist, #dayHud) .stackv i { min-height: 1px; }
:is(#hist, #dayHud) .v1 { background: var(--valle); } :is(#hist, #dayHud) .v2 { background: var(--llano); } :is(#hist, #dayHud) .v3 { background: var(--punta); }
:is(#hist, #dayHud) .outl { width: 100%; height: 100%; box-shadow: inset 0 0 0 1.5px var(--llano); }

/* detalle de una carga */
:is(#hist, #dayHud) .det { padding: 6px 0 14px; }
:is(#hist, #dayHud) .det .dk { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14px; }
:is(#hist, #dayHud) .det .dk span { color: var(--ink-2); }
:is(#hist, #dayHud) .det .dk b { font-weight: 500; text-align: right; }
:is(#hist, #dayHud) .det .dk em { color: var(--ink-2); font-style: normal; font-weight: 400; margin-left: 6px; }
:is(#hist, #dayHud) .det .dbar { height: 5px; margin: 4px 0 6px; }
:is(#hist, #dayHud) .det .ddel { margin-top: 6px; height: 40px; padding: 0 14px; border-radius: 10px; background: var(--glass-in); color: #ff8080; font-size: 14px; transition: transform 140ms var(--ease-out); }
:is(#hist, #dayHud) .det .ddel:active { transform: scale(0.97); }


/* calendario */
#hist .mhead { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
#hist .mhead h3 { font-size: 20px; font-weight: 600; text-transform: capitalize; }
#hist .mhead div { display: flex; }
#hist .mnav { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 50%; transition: transform 140ms var(--ease-out); }
#hist .mnav:active { transform: scale(0.92); }
#hist .mnav svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#hist .wk, #hist .cgrid { display: grid; grid-template-columns: repeat(7, 1fr); }
#hist .wk { margin-top: 8px; font-size: 12px; color: var(--ink-2); text-align: center; }
#hist .cgrid { margin-top: 2px; }
#hist .gridwrap.slide { animation: hslide 240ms var(--ease-out); }
#hist .gridwrap.slide.back { animation-name: hslideb; }
@keyframes hslide { from { transform: translateX(18px); opacity: 0; } }
@keyframes hslideb { from { transform: translateX(-18px); opacity: 0; } }
#hist .day { position: relative; height: 62px; padding: 6px 0 0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; transition: background-color 140ms ease; }
#hist .day:active { background: #101010; }
#hist .day .dn { font-size: 12px; color: var(--ink-2); line-height: 1; }
#hist .day.today .dn { color: var(--ink); font-weight: 600; }
#hist .day.today .dn::after { content: ""; display: block; height: 2px; margin: 3px auto 0; width: 12px; background: var(--ink); }
#hist .day .dbars { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; align-items: flex-end; gap: 3px; height: 38px; }
#hist .day .dbars > span { display: flex; width: 12px; }
#hist .day[aria-pressed="true"] { background: var(--glass-in); box-shadow: inset 0 0 0 1px #3a3a3c; }
/* Panel del día (HUD): flota sobre el calendario, semitransparente, con el tinte del fondo */
#dayHud { position: absolute; z-index: 6; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 12px); max-height: min(60%, 480px); display: flex; flex-direction: column; border-radius: 28px; overflow: hidden;
  --line: rgba(255, 255, 255, 0.1);
  background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  opacity: 0; visibility: hidden; transform: translateY(28px) scale(0.98); transform-origin: 50% 100%;
  transition: opacity 180ms var(--ease-out), transform 300ms var(--ease-drawer), visibility 0s 300ms; }
#dayHud.open { opacity: 1; visibility: visible; transform: none; transition: opacity 200ms var(--ease-out), transform 340ms var(--ease-drawer), visibility 0s; }
#dayHud.drag { transition: none; }
#dayHud .hud-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 8px 4px 20px; touch-action: none; cursor: grab; }
#dayHud .hud-bar h4 { font-size: 17px; font-weight: 600; }
#dayHud .hud-bar p { margin-top: 2px; font-size: 13px; color: var(--ink-2); }
#dayHud .hud-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 20px 14px; }
#dayHud .hud-body::-webkit-scrollbar { display: none; }
#dayHud .none { margin-top: 6px; padding-bottom: 6px; font-size: 14px; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { #dayHud { transform: none; } }
:is(#hist, #dayHud) .cd { padding: 10px 0; border-bottom: 1px solid var(--line); }
:is(#hist, #dayHud) .cd:last-child { border: 0; }
:is(#hist, #dayHud) .cd .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 17px; }
:is(#hist, #dayHud) .cd .top b { font-weight: 500; }
:is(#hist, #dayHud) .cd .l2 { margin-top: 2px; font-size: 13px; color: var(--ink-2); }

/* Ajustes, importar y taller de fichas */
.lrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 60px; padding: 10px 0; text-align: left; transition: background-color 140ms ease; }
.lrow + .lrow { border-top: 1px solid #1a1a1a; }
.lrow:active { background: #0d0d0d; }
.lrow b { display: block; font-size: 17px; font-weight: 500; }
.lrow em { display: block; margin-top: 3px; font-style: normal; font-size: 13px; line-height: 1.3; color: var(--ink-2); }
.lrow svg { flex: none; fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lrow.danger b { color: #ff6b6b; }
.msg { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--glass-in); font-size: 14px; line-height: 1.35; }
.msg.err { color: #ff8a80; }
.msg.ok { color: var(--accent); }
.ghost { display: block; margin: 8px auto 0; }
.fx-prev { display: grid; place-items: center; padding: 18px 0 4px; }
.fx-prev .chip { width: 126px; height: 126px; --k: 1; }
.fx-name { margin-top: 10px; text-align: center; font-size: 15px; color: var(--ink-2); }
.fx-pick { display: flex; justify-content: space-between; margin-top: 18px; }
.fx-pick button { position: relative; width: 44px; height: 44px; border-radius: 50%; transition: transform 140ms var(--ease-out); }
.fx-pick button:active { transform: scale(0.94); }
.fx-pick button[aria-pressed="true"]::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ink); }
.fx-pick .chip { --k: 1; }
.fx-sw { display: flex; justify-content: space-between; }
.fx-sw button { position: relative; width: 44px; height: 44px; display: grid; place-items: center; }
.fx-sw button i { display: block; width: 28px; height: 28px; border-radius: 50%; transition: transform 140ms var(--ease-out); }
.fx-sw button:active i { transform: scale(0.92); }
.fx-sw button[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.fx-tex { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px 0; justify-items: center; }
.fx-tex button { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 56px; min-height: 44px; font-size: 12px; color: var(--ink-2); }
.fx-tex button i { position: relative; display: block; width: 44px; height: 44px; border-radius: 50%; transition: transform 140ms var(--ease-out); }
.fx-tex button:active i { transform: scale(0.94); }
.fx-tex button[aria-pressed="true"] { color: var(--ink); }
.fx-tex button[aria-pressed="true"] i::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ink); }
.fx-tex .chip { --k: 1; }
.fx-sec { margin: 22px 0 0; }
.fx-sec h3 { margin: 0 0 8px; }
.fx-sec .seg.wide { margin-top: 0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; scroll-behavior: auto !important; } .bg-rings i { animation: none; } }
</style>

<script src="logic.js"></script>
<script>
(() => {
  'use strict';
  const L = CargaLogic;
  const $ = (s) => document.querySelector(s);
  const appEl = $('#app');

  /* ---------- Formato (es-UY) ---------- */
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const int = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const dec = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
  /** Número con coma decimal: entre `min` y `max` decimales (sin ceros de más). */
  function fmtNum(n, min, max) {
    const k = 10 ** max;
    const [i, f0 = ''] = (Math.round(n * k) / k).toFixed(max).split('.');
    let f = f0.replace(/0+$/, '');
    while (f.length < min) f += '0';
    return f ? `${i},${f}` : i;
  }
  const kwhTxt = (n) => fmtNum(n, 1, 2); // el cargador muestra hasta 2 decimales
  const pctTxt = (n) => fmtNum(n, 0, 1); // el % de batería, hasta 1 decimal
  const money = (n) => '$ ' + int(n);
  const money2 = (n) => '$ ' + dec(n, 2);
  const hhmm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const shortDate = (d) => `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const toInput = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}T${hhmm(d)}`;
  const num = (v) => parseFloat(String(v).replace(',', '.'));

  /* ---------- Estado y persistencia ---------- */
  const KEY = 'carga.v3';
  const DEFAULTS = () => ({
    vehicle: { name: 'GAC Aion UT Max', batteryKwh: 60, consumptionWhKm: 135 },
    rates: { ...L.UTE_2026_RATES }, puntaStart: L.DEFAULT_PUNTA_START, amps: 24, volts: 226, charges: [],
  });

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}
  if (!S || !Array.isArray(S.charges)) { S = DEFAULTS(); S.charges = L.makeSeed(new Date()); }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };

  const nominalKw = () => (S.amps > 0 && S.volts > 0 ? L.chargerKw(S.amps, S.volts) : 0);
  const homeCharges = () => S.charges.filter((c) => c.location === 'home');
  const calibration = () => L.computeCalibration(homeCharges(), nominalKw(), S.vehicle.batteryKwh);
  const consumption = () => { const real = L.realConsumption(S.charges, S.vehicle.batteryKwh); return { real, rc: L.rangeConsumption(S.vehicle, real) }; };

  /* ---------- Precios de redes públicas (en vivo → caché → resguardo) ---------- */
  const NET_URL = 'https://evuruguay.com/cargadores_all.csv', NET_KEY = 'carga.v3.redes';
  let net = { rows: L.FALLBACK_NETWORK_ROWS, source: 'base', at: null };
  async function loadNetworks() {
    try { const c = JSON.parse(localStorage.getItem(NET_KEY)); if (c && c.rows && c.rows.length) net = { rows: c.rows, source: 'guardado', at: c.at }; } catch (_) {}
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 4000);
      const res = await fetch(NET_URL, { signal: ctl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!res.ok) throw new Error(res.status);
      const rows = L.parseCsv(await res.text());
      if (!rows.length) throw new Error('vacío');
      net = { rows, source: 'en vivo', at: Date.now() };
      try { localStorage.setItem(NET_KEY, JSON.stringify({ rows, at: net.at })); } catch (_) {}
    } catch (_) { /* sin red: se queda con caché o resguardo */ }
    renderAll();
  }
  const groups = () => L.groupNetworkRows(net.rows);

  /* ---------- Fichas: carril con zoom central ---------- */
  const SLOT = 100, CHIP_D = 126, CHIP_GAP = 16; // paso del carril, diámetro de la ficha activa, espacio fijo entre bordes
  function makeRail(el, { count, html, label, onChange, onActivate, onFrame }) {
    el.innerHTML = Array.from({ length: count }, (_, i) => `<button class="slot" data-i="${i}" aria-label="${label(i)}"><span class="c">${html(i)}</span></button>`).join('');
    const slots = [...el.children], discs = slots.map((s) => s.firstElementChild);
    let idx = -1, prog = false, timer = 0, raf = 0, md = null, dragged = false;
    const at = () => Math.max(0, Math.min(count - 1, Math.round(el.scrollLeft / SLOT)));
    /**
     * Cada ficha se acomoda por sus bordes, no por sus centros: con tamaños distintos, centros parejos dejan
     * espacios desiguales (casi nada junto a la grande, mucho entre las chicas). Se suman los diámetros reales
     * más un espacio fijo, y el punto que corresponde a la posición del carril queda justo bajo la flecha.
     */
    function paint() {
      const p = el.scrollLeft / SLOT, ds = [], ks = [];
      for (let i = 0; i < count; i++) {
        const k = Math.max(0, 1 - Math.abs(i - p));
        ks.push(k); ds.push(CHIP_D * (0.52 + 0.48 * (k * k * (3 - 2 * k))));
      }
      const cs = []; let x = 0;
      for (let i = 0; i < count; i++) { cs.push(x + ds[i] / 2); x += ds[i] + CHIP_GAP; }
      const lo = Math.max(0, Math.min(count - 1, Math.floor(p))), hi = Math.min(count - 1, lo + 1);
      const pos = cs[lo] + (cs[hi] - cs[lo]) * Math.min(1, Math.max(0, p - lo));
      for (let i = 0; i < count; i++) {
        // desplazamiento = dónde debe estar la ficha − dónde la deja el carril (100 px entre centros)
        discs[i].style.transform = `translateX(${(cs[i] - pos - (i - p) * SLOT).toFixed(2)}px) scale(${(ds[i] / CHIP_D).toFixed(3)})`;
        discs[i].style.setProperty('--k', ks[i].toFixed(3));
        slots[i].style.zIndex = Math.round(ks[i] * 10);
      }
      if (onFrame) onFrame(p);
      const n = at();
      if (n !== idx) { idx = n; onChange(n, !prog); }
    }
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); };
    const onClick = (e) => {
      if (dragged) return;
      const s = e.target.closest('.slot'); if (!s) return;
      const i = +s.dataset.i;
      if (i === at()) onActivate(i); else go(i, true, true);
    };
    const onKey = (e) => {
      if (e.key === 'ArrowRight' && at() < count - 1) go(at() + 1, true, true);
      if (e.key === 'ArrowLeft' && at() > 0) go(at() - 1, true, true);
    };
    // arrastre con mouse (solo vista previa de escritorio)
