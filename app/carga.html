    function sync(moveRuler) {
      const t = cfg.label();
      goV.textContent = t; goV.style.fontSize = `${t.length <= 4 ? 46 : t.length === 5 ? 38 : t.length <= 7 ? 30 : 24}px`;
      if (moveRuler && !cfg.noRuler) toRuler(cur());
      ruler.setAttribute('aria-valuenow', cur());
    }
    function config(c, hintText) {
      cfg = c; hint.textContent = hintText;
      tray.classList.toggle('noruler', !!c.noRuler);
      if (!c.noRuler) {
        const w = ruler.clientWidth || 402, half = w / 2;
        rin.style.width = `${c.max * c.ppv + w + 2}px`;
        ticks.style.cssText = `left:${half}px;width:${c.max * c.ppv + 2}px;--minor:${c.step * c.ppv}px;--major:${c.major * c.ppv}px`;
        let labels = '';
        // posiciones de los números: por defecto cada `every`; `labelAt` las pide en valores redondos (p. ej. odómetro cada 50 km)
        const at = c.labelAt ? c.labelAt() : Array.from({ length: Math.floor(c.max / c.every) + 1 }, (_, i) => i * c.every);
        at.forEach((n) => { labels += `<span style="left:${half + n * c.ppv}px">${c.tick(n)}</span>`; });
        rin.querySelectorAll('span').forEach((s) => s.remove());
        rin.insertAdjacentHTML('beforeend', labels);
        ruler.setAttribute('aria-valuemin', c.base || 0); ruler.setAttribute('aria-valuemax', (c.base || 0) + c.max); ruler.setAttribute('aria-label', c.aria || 'Valor');
      }
      nbs.forEach((b, i) => { b.textContent = c.nudges[i][1]; b.setAttribute('aria-label', c.nudges[i][2] || c.nudges[i][1]); });
      sync(true);
    }
    function apply(v) { cfg.set(v); sync(true); cfg.onChange(); }
    ruler.addEventListener('scroll', () => {
      if (prog || !cfg || cfg.noRuler) return;
      // `base`: la regla puede arrancar en un valor distinto de cero (p. ej. el último odómetro)
      const v = (cfg.base || 0) + Math.min(cfg.max, Math.round(ruler.scrollLeft / cfg.ppv / cfg.step) * cfg.step);
      cfg.set(cfg.step < 1 ? r1(v) : v); sync(false); cfg.onChange();
      clearTimeout(snapT); snapT = setTimeout(snap, 200);
    }, { passive: true });
    // acomodar la regla en el valor exacto solo cuando ya no se toca ni se desliza: con el dedo apoyado y quieto (o a mitad de un empujón) no debe cortarle el movimiento
    let held = false;
    const snap = () => { if (held || !cfg || cfg.noRuler) return; prog = true; ruler.scrollTo({ left: (cur() - (cfg.base || 0)) * cfg.ppv, behavior: 'smooth' }); setTimeout(() => (prog = false), 350); };
    ruler.addEventListener('touchstart', () => { held = true; }, { passive: true });
    const released = () => { held = false; clearTimeout(snapT); snapT = setTimeout(snap, 200); };
    ruler.addEventListener('touchend', released, { passive: true }); ruler.addEventListener('touchcancel', released, { passive: true });
    ruler.addEventListener('keydown', (e) => {
      const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      if (d != null && cfg) { e.preventDefault(); apply(cur() + d * cfg.step); }
    });
    nbs.forEach((b, i) => holdRepeat(b, (mult) => { const d = cfg.nudges[i][0]; apply(cur() + d * (cfg.kind === 'num' ? mult : 1)); }));
    goBtn.addEventListener('click', () => onGo());
    (function mouseDrag() { // solo vista previa de escritorio: arrastrar y soltar con inercia, como el dedo
      let md = null, raf = 0;
      const stop = () => cancelAnimationFrame(raf);
      /** Después de soltar, la regla sigue y frena sola (constante de tiempo ~330 ms); al detenerse, el scroll normal la acomoda en el valor. */
      function glide(v) {
        let last = performance.now();
        const tick = (now) => {
          const dt = Math.min(48, now - last); last = now;
          const before = ruler.scrollLeft;
          ruler.scrollLeft = before + v * dt;
          v *= Math.exp(-dt / 330);
          if (Math.abs(v) > 0.03 && ruler.scrollLeft !== before) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      }
      ruler.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') { stop(); md = { x: e.clientX, l: ruler.scrollLeft, moved: false, lx: e.clientX, lt: performance.now(), v: 0 }; } });
      addEventListener('pointermove', (e) => {
        if (!md) return;
        const dx = e.clientX - md.x;
        if (!md.moved && Math.abs(dx) > 3) { md.moved = true; ruler.classList.add('mouse-drag'); }
        if (!md.moved) return;
        ruler.scrollLeft = md.l - dx;
        const now = performance.now(), dt = now - md.lt;
        if (dt > 0) { md.v = 0.7 * md.v + 0.3 * ((md.lx - e.clientX) / dt); md.lx = e.clientX; md.lt = now; } // px/ms
      });
      addEventListener('pointerup', () => {
        const m = md; md = null; ruler.classList.remove('mouse-drag');
        const atEdge = ruler.scrollLeft <= 1 || ruler.scrollLeft >= ruler.scrollWidth - ruler.clientWidth - 1; // en un extremo no hay empuje
        if (m && m.moved && !atEdge && performance.now() - m.lt < 80 && Math.abs(m.v) > 0.05) glide(m.v); // ni si se frenó antes de soltar
      });
    })();
    return {
      config, sync,
      setEnabled(on) { tray.classList.toggle('off', !on); nbs.forEach((b) => (b.disabled = !on)); ruler.tabIndex = on ? 0 : -1; },
    };
  }

  /** Configuraciones de dial que se repiten en los asistentes. */
  const PCT_CFG = { kind: 'num', min: 0, max: 100, step: 0.1, ppv: 80, major: 1, every: 10, tick: String, nudges: [[-1, '−1', 'Restar 1'], [-0.1, '−0,1', 'Restar 0,1'], [0.1, '+0,1', 'Sumar 0,1'], [1, '+1', 'Sumar 1']] };
  const KWH_CFG = { ...PCT_CFG, max: 120, every: 5 };
  const CLOCK_CFG = { kind: 'time', min: 0, max: 1435, step: 5, ppv: 80 / 60, major: 60, every: 120, tick: (n) => String(n / 60).padStart(2, '0'), nudges: [[-60, '−1 h', 'Una hora antes'], [-15, '−15', '15 minutos antes'], [15, '+15', '15 minutos después'], [60, '+1 h', 'Una hora después']] };
  const PRICE_CFG = { ...PCT_CFG, max: 60, ppv: 40, every: 5 };
  const FEE_CFG = { kind: 'num', min: 0, max: 400, step: 1, ppv: 3, major: 10, every: 50, tick: String, nudges: [[-10, '−10'], [-1, '−1'], [1, '+1'], [10, '+10']] };
  /**
   * Dial del odómetro. Con un odómetro anterior, la regla arranca ahí y avanza hasta 1.500 km (marcas cada km,
   * números cada 50): el odómetro nuevo siempre es mayor. Sin uno anterior no hay desde dónde medir y queda el ajuste fino.
   */
  const odoCfg = (W) => {
    const last = lastOdo();
    return { kind: 'num', noRuler: last == null, aria: 'Odómetro', get: () => W.odo, set: (v) => { W.odo = Math.max(last || 0, Math.round(v)); }, seed: last || 0,
      label: () => (W.odo == null ? 'Omitir' : int(W.odo)), nudges: [[-10, '−10'], [-1, '−1'], [1, '+1'], [10, '+10']],
      base: last || 0, min: 0, max: 1500, step: 1, ppv: 5, major: 10, every: 50, tick: (n) => int((last || 0) + n),
      // el punto de partida y después múltiplos redondos de 50 km (16.550, 16.600…)
      labelAt: () => { const b = last || 0, out = [0]; for (let n = 50 - (b % 50); n <= 1500; n += 50) out.push(n); return out; } };
  };

  /**
   * Autonomía con el odómetro (opcional): suma el tramo desde la última carga al consumo real,
   * medido del lado de la batería con (fin % anterior − inicio % actual) × batería / km.
   */
  function autoLine(now, fromPct, endPct, kwh, odo) {
    const B = S.vehicle.batteryKwh, has = odo != null;
    const prev = S.charges.filter((c) => c.odometerKm != null).sort((a, b) => new Date(b.startAt) - new Date(a.startAt))[0];
    let list = S.charges, seg = '';
    if (has) {
      if (prev && odo <= prev.odometerKm) seg = `El odómetro tiene que ser mayor al de tu última carga (${int(prev.odometerKm)} km).`;
      else {
        list = [...S.charges, { location: 'home', startAt: now.toISOString(), odometerKm: odo, kwh, startPct: fromPct, endPct }];
        const km = prev ? odo - prev.odometerKm : 0, used = prev && prev.endPct != null && fromPct != null ? ((prev.endPct - fromPct) / 100) * B : 0;
        if (prev && km >= 10 && used > 0) seg = ` Desde tu última carga: ${dec((used / km) * 100, 1)} kWh/100 km en ${int(km)} km.`;
      }
    }
    const rc = L.rangeConsumption(S.vehicle, L.realConsumption(list, B));
    return { km: endPct != null ? L.rangeAtPct(B, rc.whKm, endPct) : null, text: seg };
  }
  const odoCheck = (W) => { const prev = lastOdo(); return W.odo != null && prev != null && W.odo <= prev ? `Tiene que ser mayor al de tu última carga (${int(prev)} km).` : null; };
  const row = (l, v, em = '') => `<div class="kv"><span>${l}${em ? `<em>${em}</em>` : ''}</span><b>${v}</b></div>`;
  const seg2 = (act, items, sel) => `<div class="seg wide" role="group">${items.map(([v, l]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${String(sel) === String(v)}">${l}</button>`).join('')}</div>`;

  /**
   * Motor del asistente. `def.steps()` devuelve los pasos actuales (la lista puede cambiar según las respuestas).
   * Cada paso: { id, q, optional, dial() | choices()+value()+pick(v), view(), enabled(), enter(), check(), skip(), act(name, data) }.
   */
  function createWizard(root, def) {
    root.innerHTML = '<header class="fn-bar w"><button class="icon wback" aria-label="Atrás"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 4l-7 7 7 7"/></svg></button><div class="dots" role="img"></div><button class="icon txt wskip" hidden>Omitir</button></header>'
      + '<div class="fn-body"><div class="center"><p class="q" role="status" aria-live="polite"></p><button class="value wvalue" aria-label="Escribir el valor exacto"><span class="num"></span><span class="unit"></span></button>'
      + '<input class="value-input winput" type="text" autocomplete="off" aria-label="Valor" hidden><p class="meta wctx"></p><div class="wbands" style="display:contents"></div><div class="wextra"></div></div><div class="tray2 wtray"></div></div>';
    const $$ = (s) => root.querySelector(s);
    const input = $$('.winput'), valueBtn = $$('.wvalue'), extra = $$('.wextra');
    let step = 0, touched = false, saveT = 0;
    /** Guarda el borrador un instante después del último cambio, pero solo si ya se respondió algo. */
    const persist = () => { if (!touched || !def.draftId) return; clearTimeout(saveT); saveT = setTimeout(() => { if (touched && root.classList.contains('open')) saveDraft(def.draftId, step); }, 150); };
    /** Guarda ya (la app se cierra o pasa a segundo plano), solo si este asistente es el que está abierto. */
    const flush = () => { if (touched && def.draftId && root.classList.contains('open')) { clearTimeout(saveT); saveDraft(def.draftId, step); } };
    const list = () => def.steps();
    const cur = () => { const l = list(); step = Math.min(step, l.length - 1); return l[step]; };
    const dial = makeDial($$('.wtray'), () => next());

    function choiceHtml(st) {
      const items = st.choices(), sel = String(st.value());
      return `<div class="choices${items.length > 3 ? ' two' : ''}" role="group">${items.map((it) => `<button class="choice" data-pick="${esc(it.v)}" aria-pressed="${String(it.v) === sel}"><b>${esc(it.label)}</b>${it.sub ? `<em>${esc(it.sub)}</em>` : ''}</button>`).join('')}</div>`;
    }
    function update() {
      const st = cur(), v = st.view ? st.view() : {};
      $$('.num').textContent = v.num ?? ''; $$('.unit').textContent = v.unit ?? ''; $$('.wctx').textContent = v.ctx ?? '';
      $$('.wbands').innerHTML = v.bands ?? '';
      extra.innerHTML = (st.choices ? choiceHtml(st) : '') + (v.extra ?? '');
      if (st.dial) dial.sync(false);
      persist();
    }
    function render() {
      const l = list(), st = cur();
      $$('.q').textContent = st.q;
      $$('.dots').innerHTML = l.map((_, i) => `<i class="${i < step ? 'done' : i === step ? 'on' : ''}"></i>`).join('');
      $$('.dots').setAttribute('aria-label', `Paso ${step + 1} de ${l.length}`);
      $$('.wskip').hidden = !st.optional;
      input.hidden = true;
      const dc = st.dial ? st.dial() : null;
      valueBtn.hidden = !dc;
      if (dc) {
        dc.onChange = () => { touched = true; update(); };
        dial.config(dc, 'Tocá el centro para continuar');
        dial.setEnabled(st.enabled ? st.enabled() : true);
      } else {
        const last = st.id === 'sum';
        dial.config({ kind: 'num', noRuler: true, max: 0, step: 1, ppv: 1, major: 1, every: 1, tick: String, nudges: [[0, ''], [0, ''], [0, ''], [0, '']], get: () => 0, seed: 0, set() {}, label: () => (last ? def.cta : 'Siguiente'), onChange() {} }, last ? `Tocá el centro para ${def.verb}` : 'Tocá el centro para continuar');
        dial.setEnabled(false);
      }
      update();
    }
    function goTo(n) { touched = true; step = n; const st = cur(); if (st.enter) st.enter(); render(); }
    function next() {
      const st = cur(), err = st.check && st.check();
      if (err) { $$('.wctx').textContent = err; return; }
      if (st.id === 'sum') { def.finish(); return; }
      goTo(step + 1);
    }
    // salir con «atrás» desde el primer paso es descartar a propósito; cerrar la app o la pantalla sin querer conserva el borrador
    $$('.wback').addEventListener('click', () => { if (step > 0) goTo(step - 1); else { if (touched) clearDraft(); closeFn(); } });
    $$('.wskip').addEventListener('click', () => { const st = cur(); if (st.skip) st.skip(); goTo(step + 1); });
    extra.addEventListener('click', (e) => {
      const st = cur(), p = e.target.closest('[data-pick]'), a = e.target.closest('[data-act]');
      if (p && st.pick) { touched = true; st.pick(p.dataset.pick); render(); }
      else if (a && st.act) { touched = true; st.act(a.dataset.act, a.dataset); render(); }
    });
    // Tocar el número grande abre el teclado para escribir el valor exacto.
    valueBtn.addEventListener('click', () => {
      const dc = cur().dial && cur().dial(); if (!dc) return;
      input.inputMode = dc.kind === 'time' ? 'numeric' : 'decimal'; input.placeholder = dc.kind === 'time' ? 'HH:MM' : '';
      const g = dc.get();
      input.value = g == null ? '' : dc.kind === 'time' ? mm(g) : fmtNum(g, 0, 2);
      valueBtn.hidden = true; input.hidden = false; input.focus(); input.select();
    });
    function commit() {
      if (input.hidden) return;
      const dc = cur().dial && cur().dial(), raw = input.value;
      input.hidden = true; valueBtn.hidden = false;
      if (!dc) return;
      const v = dc.kind === 'time' ? parseClock(raw) : num(raw);
      if (v != null && isFinite(v)) { touched = true; dc.set(v); }
      render();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    return {
      render, flush,
      /** Después de guardar o descartar: no queda nada para conservar. */
      reset() { touched = false; clearTimeout(saveT); },
      start() { step = 0; touched = false; const st = cur(); if (st.enter) st.enter(); },
      /** Retoma un borrador: los valores ya están cargados, solo falta volver al mismo paso. */
      resume(n) { step = n; touched = true; },
    };
  }

  /* ================= Programar carga ================= */
  const W = { from: 20, stopMin: 7 * 60, goal: null, later: false, startMin: 23 * 60, odo: null };

  /** Valores de partida: % de inicio típico del historial; si hay una carga programada, sus datos. */
  function initProg() {
    const starts = S.charges.filter((c) => c.startPct != null).map((c) => c.startPct);
    Object.assign(W, { from: starts.length ? r1(starts.reduce((a, b) => a + b, 0) / starts.length) : 20, stopMin: 7 * 60, goal: null, later: false, startMin: 23 * 60, odo: null });
    const a = S.active;
    if (a) {
      const st = new Date(a.startAt), sp = new Date(a.stopAt);
      Object.assign(W, { from: a.startPct, later: a.mode === 'scheduled', startMin: minOf(st), stopMin: minOf(sp), goal: a.goal, odo: a.odo });
    }
    progWiz.start();
  }

  /** Plan con los datos cargados hasta ahora. `later` = si el inicio es a una hora fija o ahora. */
  function planCalc(now, later) {
    const B = S.vehicle.batteryKwh, kw = nominalKw(), calib = calibration().factor;
    const start = later ? nextAt(W.startMin, now, now) : now;
    const stop = nextAt(W.stopMin, start, start);
    const est = L.estimateAtTime(W.from, start, stop, kw, B, calib);
    const cost = est.kwhDelivered > 0.01
      ? L.computeHomeChargeCost(start, stop, est.kwhDelivered, S.rates, S.puntaStart, { nominalKw: kw, calibration: calib, startPct: W.from, batteryKwh: B }) : null;
    return { B, kw, calib, start, stop, est, cost };
  }
  /** Mejor hora de inicio para llegar al objetivo cortando a la hora de salida (casi todo en Valle). */
  function bestStart(now) {
    if (W.goal == null || !(nominalKw() > 0)) return null;
    return L.suggestStart({ fromPct: W.from, toPct: W.goal, deadline: nextAt(W.stopMin, now, now), nominalKw: nominalKw(), batteryKwh: S.vehicle.batteryKwh, calibration: calibration().factor, rates: S.rates, puntaStart: S.puntaStart, altStart: now });
  }

  const PROG_STEPS = [
    { id: 'from', q: '¿Con cuánta batería enchufás?',
      dial: () => ({ ...PCT_CFG, aria: 'Batería al enchufar', get: () => W.from, set: (v) => { W.from = setPct(v); }, seed: W.from, label: () => pctTxt(W.from) }),
      view: () => { const rc = L.rangeConsumption(S.vehicle, L.realConsumption(S.charges, S.vehicle.batteryKwh)); return { num: pctTxt(W.from), unit: '%', ctx: `≈ ${L.rangeAtPct(S.vehicle.batteryKwh, rc.whKm, W.from)} km de autonomía ahora` }; } },
    { id: 'stop', q: '¿A qué hora cortás?',
      dial: () => ({ ...CLOCK_CFG, aria: 'Hora de corte', get: () => W.stopMin, set: (v) => { W.stopMin = wrap(v); }, seed: W.stopMin, label: () => mm(W.stopMin) }),
      view: () => { const p = planCalc(new Date(), false); return { num: mm(W.stopMin), ctx: p.cost ? `Si empezás ahora llegás a ≈ ${pctTxt(p.est.pct)}% · ${kwhTxt(p.est.kwhDelivered)} kWh · ${money(p.cost.total)}` : '' }; } },
    { id: 'goal', q: '¿Hasta cuánta batería querés llegar?', optional: true,
      dial: () => ({ ...PCT_CFG, aria: 'Objetivo de batería', get: () => W.goal, set: (v) => { W.goal = r1(Math.max(W.from + GAP, Math.min(100, v))); }, seed: Math.max(80, W.from + GAP), label: () => (W.goal == null ? 'Omitir' : pctTxt(W.goal)) }),
      skip: () => { W.goal = null; },
      view: () => ({ num: W.goal == null ? '—' : pctTxt(W.goal), unit: W.goal == null ? '' : '%', ctx: W.goal == null ? 'Opcional: con un objetivo te digo a qué hora empezar.' : `${kwhTxt(L.kwhFromPct(W.from, W.goal, S.vehicle.batteryKwh) || 0)} kWh a cargar` }) },
    { id: 'start', q: '¿Cuándo empieza?',
      dial: () => ({ ...CLOCK_CFG, aria: 'Hora de inicio', get: () => W.startMin, set: (v) => { W.startMin = wrap(v); W.later = true; }, seed: W.startMin, label: () => (W.later ? mm(W.startMin) : 'Ahora') }),
      enabled: () => W.later,
      // con un objetivo, la hora de inicio arranca en la sugerida (todo en Valle)
      enter: () => { const s = bestStart(new Date()); if (s && s.start > new Date()) { W.later = true; W.startMin = minOf(s.start); } },
      act: (name, d) => { if (name === 'later') W.later = d.v === '1'; else if (name === 'usesug') { W.later = true; W.startMin = Number(d.m); } },
      view: () => {
        const now = new Date(), p = planCalc(now, W.later), s = bestStart(now);
        let extra = seg2('later', [[0, 'Ahora'], [1, 'Más tarde']], W.later ? 1 : 0);
        if (s && s.start > now) { const m = minOf(s.start); extra += `<p class="note">Para llegar a ${pctTxt(W.goal)}%, lo mejor es empezar a las ${mm(m)} (${Math.round(s.valleShare * 100)}% en Valle, ${money(s.best.total)}).${W.later && W.startMin === m ? '' : ` <button class="link inl-link" data-act="usesug" data-m="${m}">Usar esa hora</button>`}</p>`; }
        return { num: W.later ? mm(W.startMin) : 'Ahora', ctx: p.cost ? `≈ ${pctTxt(p.est.pct)}% a las ${mm(W.stopMin)} · ${kwhTxt(p.est.kwhDelivered)} kWh · ${money(p.cost.total)}` : '', bands: p.cost ? bands(p.cost.valleKwh, p.cost.llanoKwh, p.cost.puntaKwh) : '', extra };
      } },
    { id: 'odo', q: '¿Cuál es el odómetro?', optional: true,
      dial: () => odoCfg(W), skip: () => { W.odo = null; }, check: () => odoCheck(W),
      view: () => { const p = planCalc(new Date(), W.later), a = autoLine(new Date(), W.from, W.goal ?? p.est.pct, p.est.kwhDelivered, W.odo); return { num: W.odo == null ? '—' : int(W.odo), unit: W.odo == null ? '' : 'km', ctx: W.odo == null ? 'Opcional: con el odómetro se afina tu consumo real y la autonomía.' : `Autonomía al terminar ≈ ${a.km} km. ${a.text}` }; } },
    { id: 'sum', q: 'Todo listo',
      view: () => {
        const now = new Date(), p = planCalc(now, W.later), a = autoLine(now, W.from, W.goal ?? p.est.pct, p.est.kwhDelivered, W.odo);
        return { extra: row('Empieza', W.later ? hhmm(p.start) : 'Ahora', W.later ? '' : 'en cuanto confirmes') + row('Corta', hhmm(p.stop))
          + row('Batería', `${pctTxt(W.from)}% → ≈ ${pctTxt(p.est.pct)}%`, W.goal != null ? `objetivo ${pctTxt(W.goal)}%` : '') + row('Energía', `${kwhTxt(p.est.kwhDelivered)} kWh`)
          + (p.cost ? row('Costo estimado', money(p.cost.total), `${Math.round((p.cost.valleKwh / p.est.kwhDelivered) * 100)}% en Valle`) : '') + row('Autonomía', `≈ ${a.km} km`, W.odo != null ? `odómetro ${int(W.odo)} km` : '') };
      } },
  ];
  const progWiz = createWizard($('#fn-prog'), { steps: () => PROG_STEPS, cta: 'Programar', verb: 'programar', draftId: 'prog', finish: () => scheduleCharge() });
  const renderProg = () => progWiz.render();

  /** Crea la carga activa: "Ahora" arranca a contar ya; "Más tarde" queda en espera hasta la hora de inicio. */
  function scheduleCharge() {
    const now = new Date();
    if (!isFinite(W.from) || !(nominalKw() > 0)) { $('#fn-prog .wctx').textContent = 'Configurá tu cargador en Autonomía.'; return; }
    const start = W.later ? nextAt(W.startMin, now, now) : now, stop = nextAt(W.stopMin, start, start);
    S.active = { mode: W.later ? 'scheduled' : 'live', startAt: start.toISOString(), stopAt: stop.toISOString(), startPct: W.from, goal: W.goal, odo: W.odo };
    confirmAt = null; confirmShown = false; persist(); clearDraft();
    closeFn(); renderStatus(); tick();
    flash(W.later ? `Programada · empieza a las ${hhmm(start)}` : `Cargando desde ${pctTxt(W.from)}%`);
  }

  /* ================= Registrar carga (ya cargada) ================= */
  const R = { kind: 'home', by: 'kwh', kwh: 25, from: 20, to: 80, when: 'now', day: 0, endMin: 0, startMin: 0, startTouched: false, net: '', varIdx: 0, price: null, fee: null, odo: null };

  /** Valores de partida a partir del historial: la última carga y el % de inicio típico. */
  function initCargar() {
    const sorted = [...S.charges].sort((a, b) => new Date(b.startAt) - new Date(a.startAt)), starts = S.charges.filter((c) => c.startPct != null).map((c) => c.startPct);
    const from = starts.length ? r1(starts.reduce((a, b) => a + b, 0) / starts.length) : 20;
    Object.assign(R, { kind: 'home', by: 'kwh', kwh: sorted[0] ? r1(sorted[0].kwh) : 25, from, to: Math.max(from + GAP, sorted[0] && sorted[0].endPct != null ? sorted[0].endPct : 80), when: 'now', day: 0, endMin: minOf(new Date()), startTouched: false, net: '', varIdx: 0, price: null, fee: null, odo: null });
    regWiz.start();
  }
  const rGroup = () => groups().find((g) => g.key === R.net) || null;
  const rVariant = () => { const g = rGroup(); return g ? g.variants[Math.min(R.varIdx, g.variants.length - 1)] : null; };
  const rKwh = () => (R.by === 'kwh' ? R.kwh : r2(L.kwhFromPct(R.from, R.to, S.vehicle.batteryKwh) || 0));
  /** Elige la red (por defecto UTE) con la variante vigente a esta hora y su precio sugerido. */
  function setNet(key) {
    const g = groups().find((x) => x.key === key) || groups().find((x) => x.key === 'UTE') || groups()[0];
    if (!g) return;
    R.net = g.key; R.varIdx = Math.max(0, g.variants.indexOf(L.pickVariant(g, new Date())));
    useVariantPrice();
  }
  function useVariantPrice() { const v = rVariant(); if (v) { R.price = v.price; R.fee = v.fee; } }
  /** Momento en que terminó la carga: "recién" = ahora; si no, el día (hoy o ayer) y la hora elegidos. */
  function rEnd(now) {
    if (R.when === 'now') return now;
    let d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - R.day, 0, R.endMin);
    if (d > now) d = new Date(d.getTime() - 864e5); // esa hora de hoy todavía no llegó
    return d;
  }
  /** Duración estimada de la carga por la potencia del cargador (con cola CV si se cargó por %). */
  function rMinutes(kwh) {
    const kw = nominalKw();
    if (!(kwh > 0 && kw > 0)) return 120;
    return Math.max(10, R.by === 'pct' ? L.minutesToDeliver(R.from, kwh, kw, S.vehicle.batteryKwh, calibration().factor) || 120 : Math.ceil((kwh / kw) * 60));
  }
  function rWindow(now, kwh) {
    const end = rEnd(now);
    if (R.when === 'pick' && R.startTouched) {
      let s = new Date(end.getFullYear(), end.getMonth(), end.getDate(), 0, R.startMin);
      if (s >= end) s = new Date(s.getTime() - 864e5);
      return { start: s, end };
    }
    return { start: new Date(end.getTime() - rMinutes(kwh) * 60000), end };
  }
  /** Costo con el motor (nunca se guarda un costo tipeado a mano); null si falta algún dato. */
  function rCalc(now) {
    const kwh = rKwh();
    if (!(kwh > 0)) return null;
    try {
      if (R.kind === 'home') {
        const w = rWindow(now, kwh);
        const r = L.computeHomeChargeCost(w.start, w.end, kwh, S.rates, S.puntaStart, { nominalKw: nominalKw(), calibration: calibration().factor, startPct: R.by === 'pct' ? R.from : null, batteryKwh: S.vehicle.batteryKwh });
        return { kwh, w, r, cost: r.total };
      }
      return { kwh, price: R.price, fee: R.fee || 0, at: rEnd(now), cost: L.computePublicChargeCost(R.price, kwh, R.fee || 0) };
    } catch (e) { return { kwh, error: e.message }; }
  }
  const dayTxt = (d, now) => (d.toDateString() === now.toDateString() ? 'hoy' : d.toDateString() === new Date(now.getTime() - 864e5).toDateString() ? 'ayer' : shortDate(d));

  const REG_STEPS = () => {
    const s = [REG.where, REG.how];
    if (R.by === 'kwh') s.push(REG.kwh); else s.push(REG.pfrom, REG.pto);
    if (R.kind === 'public') { s.push(REG.net); if ((rGroup() ? rGroup().variants.length : 0) > 1) s.push(REG.variant); s.push(REG.price); if ((R.fee || 0) > 0) s.push(REG.fee); }
    s.push(REG.when);
    if (R.when === 'pick') { s.push(REG.hend); if (R.kind === 'home') s.push(REG.hstart); }
    s.push(REG.odo, REG.sum);
    return s;
  };
  const REG = {
    where: { id: 'where', q: '¿Dónde cargaste?',
      choices: () => [{ v: 'home', label: 'Casa', sub: 'cargador propio, tarifa de UTE' }, { v: 'public', label: 'Pública', sub: 'red de cargadores o trabajo' }],
      value: () => R.kind, pick: (v) => { R.kind = v; if (v === 'public' && !R.net) setNet('UTE'); } },
    how: { id: 'how', q: '¿Cómo querés cargar el dato?',
      choices: () => [{ v: 'kwh', label: 'Por kWh', sub: 'lo que marcó el cargador o el medidor' }, { v: 'pct', label: 'Por % de batería', sub: 'lo que mostró el auto al empezar y al terminar' }],
      value: () => R.by, pick: (v) => { R.by = v; } },
    kwh: { id: 'kwh', q: '¿Cuántos kWh cargaste?',
      dial: () => ({ ...KWH_CFG, aria: 'kWh cargados', get: () => R.kwh, set: (v) => { R.kwh = Math.min(200, Math.max(0.1, r2(v))); }, seed: R.kwh, label: () => kwhTxt(R.kwh) }),
      view: () => ({ num: kwhTxt(R.kwh), unit: 'kWh', ctx: 'Tocá el número para escribirlo con decimales, ej. 23,47.' }) },
    pfrom: { id: 'pfrom', q: '¿Con cuánta batería empezaste?',
      dial: () => ({ ...PCT_CFG, aria: 'Batería al empezar', get: () => R.from, set: (v) => { R.from = setPct(v); if (R.to < R.from + GAP) R.to = r1(Math.min(100, R.from + GAP)); }, seed: R.from, label: () => pctTxt(R.from) }),
      view: () => { const rc = L.rangeConsumption(S.vehicle, L.realConsumption(S.charges, S.vehicle.batteryKwh)); return { num: pctTxt(R.from), unit: '%', ctx: `≈ ${L.rangeAtPct(S.vehicle.batteryKwh, rc.whKm, R.from)} km de autonomía en ese momento` }; } },
    pto: { id: 'pto', q: '¿Con cuánta terminaste?',
      dial: () => ({ ...PCT_CFG, aria: 'Batería al terminar', get: () => R.to, set: (v) => { R.to = r1(Math.max(R.from + GAP, Math.min(100, v))); }, seed: R.to, label: () => pctTxt(R.to) }),
      view: () => ({ num: pctTxt(R.to), unit: '%', ctx: `${pctTxt(R.from)}% → ${pctTxt(R.to)}% = ${kwhTxt(rKwh())} kWh` }) },
    net: { id: 'net', q: '¿En qué red cargaste?',
      choices: () => groups().map((g) => ({ v: g.key, label: g.key })), value: () => R.net, pick: (v) => setNet(v) },
    variant: { id: 'variant', q: '¿Qué franja o conector?',
      choices: () => (rGroup() ? rGroup().variants.map((v, i) => ({ v: i, label: v.label, sub: `${money2(v.price)}/kWh${v.fee > 0 ? ` + ${money(v.fee)} fijo` : ''}` })) : []),
      value: () => R.varIdx, pick: (v) => { R.varIdx = Number(v); useVariantPrice(); } },
    price: { id: 'price', q: '¿Cuánto cobraron por kWh?',
      dial: () => ({ ...PRICE_CFG, aria: 'Precio por kWh', get: () => R.price, set: (v) => { R.price = r2(Math.max(0.1, v)); }, seed: (rVariant() || {}).price || 10, label: () => (R.price == null ? '—' : fmtNum(R.price, 2, 2)) }),
      view: () => { const v = rVariant(); return { num: R.price == null ? '—' : fmtNum(R.price, 2, 2), unit: '$/kWh', ctx: v ? `Sugerido ${money2(v.price)} (datos ${net.source}). Tocá el número para escribirlo.` : '' }; } },
    fee: { id: 'fee', q: '¿Cuánto es el cargo fijo?', optional: true,
      dial: () => ({ ...FEE_CFG, aria: 'Cargo fijo', get: () => R.fee, set: (v) => { R.fee = r1(Math.max(0, v)); }, seed: R.fee || 0, label: () => fmtNum(R.fee || 0, 0, 1) }),
      skip: () => { R.fee = 0; },
      view: () => ({ num: fmtNum(R.fee || 0, 0, 1), unit: '$', ctx: 'Se cobra una vez por sesión, no depende de los kWh.' }) },
    when: { id: 'when', q: '¿Cuándo cargaste?',
      choices: () => [{ v: 'now', label: 'Recién terminé', sub: R.kind === 'home' ? 'el horario se estima con la potencia de tu cargador' : 'ahora mismo' }, { v: 'pick', label: 'Elegir el horario', sub: 'otro día u otra hora' }],
      value: () => R.when, pick: (v) => { R.when = v; } },
    hend: { id: 'hend', get q() { return R.kind === 'home' ? '¿A qué hora terminó?' : '¿A qué hora fue?'; },
      dial: () => ({ ...CLOCK_CFG, aria: 'Hora', get: () => R.endMin, set: (v) => { R.endMin = wrap(v); }, seed: R.endMin, label: () => mm(R.endMin) }),
      act: (name, d) => { if (name === 'day') R.day = Number(d.v); },
      view: () => { const now = new Date(), e = rEnd(now); return { num: mm(R.endMin), ctx: `${cap(dayTxt(e, now))} a las ${hhmm(e)}${R.day === 0 && minOf(e) !== R.endMin ? ' (esa hora de hoy todavía no llegó)' : ''}`, extra: seg2('day', [[0, 'Hoy'], [1, 'Ayer']], R.day) }; } },
    hstart: { id: 'hstart', q: '¿A qué hora empezó?',
      dial: () => ({ ...CLOCK_CFG, aria: 'Hora de inicio', get: () => R.startMin, set: (v) => { R.startMin = wrap(v); R.startTouched = true; }, seed: R.startMin, label: () => mm(R.startMin) }),
      // por defecto, la hora que sale de los kWh y la potencia del cargador
      enter: () => { if (!R.startTouched) R.startMin = minOf(new Date(rEnd(new Date()).getTime() - rMinutes(rKwh()) * 60000)); },
      view: () => { const c = rCalc(new Date()); return { num: mm(R.startMin), ctx: c && c.w ? `Dura ${fmtDur((c.w.end - c.w.start) / 60000)} · ${money(c.cost)}` : '', bands: c && c.r ? bands(c.r.valleKwh, c.r.llanoKwh, c.r.puntaKwh) : '' }; } },
    odo: { id: 'odo', q: '¿Cuál es el odómetro?', optional: true,
      dial: () => odoCfg(R), skip: () => { R.odo = null; }, check: () => odoCheck(R),
      view: () => {
        const kwh = rKwh(), a = R.by === 'pct' ? autoLine(new Date(), R.from, R.to, kwh, R.odo) : null;
        return { num: R.odo == null ? '—' : int(R.odo), unit: R.odo == null ? '' : 'km', ctx: R.odo == null ? 'Opcional: con el odómetro se afina tu consumo real y la autonomía.' : a ? `Autonomía al terminar ≈ ${a.km} km. ${a.text}` : 'Listo: se usa para calcular tu consumo real.' };
      } },
    sum: { id: 'sum', q: 'Todo listo',
      view: () => {
        const now = new Date(), c = rCalc(now);
        if (!c) return { extra: '<p class="note">Falta indicar cuánto cargaste.</p>' };
        if (c.error) return { extra: `<p class="note" style="color:var(--warn)">${esc(c.error)}</p>` };
        const a = R.by === 'pct' ? autoLine(now, R.from, R.to, c.kwh, R.odo) : null;
        let h = row('Dónde', R.kind === 'home' ? 'Casa' : esc((rVariant() || {}).empresa || R.net))
          + row('Energía', `${kwhTxt(c.kwh)} kWh`, R.by === 'pct' ? `${pctTxt(R.from)}% → ${pctTxt(R.to)}%` : '');
        if (R.kind === 'home') h += row('Horario', `${hhmm(c.w.start)} a ${hhmm(c.w.end)}`, cap(dayTxt(c.w.end, now)));
        else h += row('Precio', `${money2(c.price)}/kWh`, c.fee > 0 ? `+ ${money(c.fee)} de cargo fijo` : '') + row('Cuándo', `${cap(dayTxt(c.at, now))} ${hhmm(c.at)}`);
        h += row('Costo', money(c.cost), c.r ? `${Math.round((c.r.valleKwh / c.kwh) * 100)}% en Valle` : '');
        if (a) h += row('Autonomía', `≈ ${a.km} km`, R.odo != null ? `odómetro ${int(R.odo)} km` : '');
        else if (R.odo != null) h += row('Odómetro', `${int(R.odo)} km`);
        return { extra: h, bands: c.r ? bands(c.r.valleKwh, c.r.llanoKwh, c.r.puntaKwh) : '' };
      } },
  };
  const regWiz = createWizard($('#fn-cargar'), { steps: REG_STEPS, cta: 'Guardar', verb: 'guardar', draftId: 'cargar', finish: () => saveCharge() });
  const renderCargar = () => regWiz.render();

  /* ================= Borrador: retomar un asistente interrumpido ================= */
  const DRAFT_KEY = 'carga.v3.borrador', DRAFT_TTL = 48 * 36e5; // un borrador de más de 2 días ya no sirve
  const DRAFTS = { cargar: { label: 'Registrar carga', state: () => R, wiz: () => regWiz }, prog: { label: 'Programar carga', state: () => W, wiz: () => progWiz } };
  function loadDraft() {
    try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY)); if (d && DRAFTS[d.id] && Date.now() - d.at < DRAFT_TTL) return d; } catch (_) {}
    return null;
  }
  function saveDraft(id, step) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ id, step, at: Date.now(), state: DRAFTS[id].state() })); } catch (_) {} }
  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
    Object.values(DRAFTS).forEach((x) => x.wiz().reset());
    renderDraft();
  }
  const agoTxt = (t) => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 1 ? 'hace un momento' : m < 60 ? `hace ${m} min` : `hace ${Math.round(m / 60)} h`; };
  let draftShown = '';
  function renderDraft() {
    const el = $('#draftBar'), d = loadDraft();
    if (!d) { el.hidden = true; el.innerHTML = ''; draftShown = ''; return; }
    const html = `<p>Borrador sin guardar</p><p class="ds">${DRAFTS[d.id].label} · ${agoTxt(d.at)}</p><div class="da"><button data-draft="resume">Continuar</button><button data-draft="discard">Eliminar</button></div>`;
    if (html !== draftShown) { el.innerHTML = html; draftShown = html; }
    el.hidden = false;
  }
  function resumeDraft() {
    const d = loadDraft(); if (!d) return;
    Object.assign(DRAFTS[d.id].state(), d.state); // los valores vuelven tal cual, el asistente retoma en el mismo paso
    openFn(d.id, d.step);
  }
  $('#draftBar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-draft]'); if (!b) return;
    if (b.dataset.draft === 'resume') resumeDraft(); else if (confirm('¿Eliminar el borrador?')) clearDraft();
  });
  // si la app se cierra o pasa a segundo plano a mitad de un asistente, el borrador se guarda al instante
  const flushDrafts = () => Object.values(DRAFTS).forEach((x) => x.wiz().flush());
  addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDrafts(); });
  addEventListener('pagehide', flushDrafts);

  let saving = false;
  function saveCharge() {
    const now = new Date(), c = rCalc(now);
    if (!c || c.error || saving) { if (c && c.error) $('#fn-cargar .wctx').textContent = c.error; return; }
    const err = odoCheck(R);
    if (err) { $('#fn-cargar .wctx').textContent = err; return; }
    saving = true; setTimeout(() => (saving = false), 800); // un doble toque no guarda dos veces
    const base = { id: Date.now(), kwh: c.kwh, odometerKm: R.odo, startPct: R.by === 'pct' ? R.from : null, endPct: R.by === 'pct' ? R.to : null, pricePerKwh: null, fixedFee: null, network: null, endAt: null };
    const ch = R.kind === 'home'
      ? { ...base, location: 'home', startAt: c.w.start.toISOString(), endAt: c.r.finishedAt.toISOString(), cost: c.cost, valleKwh: c.r.valleKwh, llanoKwh: c.r.llanoKwh, puntaKwh: c.r.puntaKwh }
      : { ...base, location: 'public', startAt: c.at.toISOString(), pricePerKwh: c.price, fixedFee: c.fee, network: (rVariant() || {}).empresa || R.net || 'Otro', cost: c.cost, valleKwh: 0, llanoKwh: 0, puntaKwh: 0 };
    S.charges.push(ch); persist(); clearDraft();
    while (stack.length) closeFn();
    renderAll();
    flash(`Carga guardada · ${money(ch.cost)}`);
  }

  /* ----- Carga en curso: en espera, cargando, a confirmar ----- */
  // «Terminar ahora» queda guardado con la carga activa: si se cierra la app, la hora de fin no se pierde
  let confirmAt = S.active && S.active.endedAt ? new Date(S.active.endedAt) : null, confirmShown = false, confirmEnd = null;
  function activeInfo(now) {
    const a = S.active, B = S.vehicle.batteryKwh, kw = nominalKw(), calib = calibration().factor;
    const start = new Date(a.startAt), stop = new Date(a.stopAt);
    const st = confirmAt ? 'ended' : now < start ? 'waiting' : now < stop ? 'charging' : 'ended';
    const est = (to) => L.estimateAtTime(a.startPct, start, to, kw, B, calib);
    const cost = (kwh, to) => (kwh > 0.01 && to > start ? L.computeHomeChargeCost(start, to, kwh, S.rates, S.puntaStart, { nominalKw: kw, calibration: calib, startPct: a.startPct, batteryKwh: B }) : null);
    return { a, st, start, stop, B, kw, calib, est, cost };
  }

  function renderStatus() {
    const bar = $('#activeBar'), a = S.active;
    if (!a) { bar.hidden = true; appEl.classList.remove('live'); return; }
    const now = new Date(), I = activeInfo(now);
    bar.hidden = false; bar.classList.toggle('live', I.st === 'charging'); appEl.classList.toggle('live', I.st === 'charging'); // con una carga en curso las ondas van más rápido
    if (I.st === 'waiting') bar.textContent = `Programada · arranca en ${fmtDur((I.start - now) / 60000)}`;
    else if (I.st === 'charging') bar.textContent = `Cargando · ≈ ${pctTxt(I.est(now).pct)}% · corta ${hhmm(I.stop)}`;
    else bar.textContent = 'Terminó · confirmá tu carga';
  }
  $('#activeBar').addEventListener('click', () => openFn('activa'));

  function renderActiva() {
    const box = $('#activa'), a = S.active;
    if (!a) { box.innerHTML = '<p class="note">No hay ninguna carga programada.</p>'; confirmShown = false; return; }
    const now = new Date(), I = activeInfo(now);
    if (I.st === 'ended') { if (!confirmShown) { renderConfirm(I); confirmShown = true; } return; }
    confirmShown = false;
    if (I.st === 'waiting') {
      const eStop = I.est(I.stop), c = I.cost(eStop.kwhDelivered, I.stop);
      box.innerHTML = `<div class="hero2"><p class="big" style="font-size:min(56px,14vw)">${fmtDur((I.start - now) / 60000)}</p><p class="sub">arranca a las ${hhmm(I.start)} · corta a las ${hhmm(I.stop)}</p><p class="find">Desde ${pctTxt(a.startPct)}%. Al corte ≈ ${pctTxt(eStop.pct)}% (${kwhTxt(eStop.kwhDelivered)} kWh).</p></div>`
        + (c ? `<div class="kv"><span>Costo estimado</span><b>${money(c.total)}</b></div>${bands(c.valleKwh, c.llanoKwh, c.puntaKwh)}` : '')
        + `<button class="pill" id="aNow">Empezar ahora</button><button class="link" id="aEdit">Cambiar horarios</button><button class="link" id="aCancel">Cancelar programación</button>`;
    } else {
      const e = I.est(now), eStop = I.est(I.stop), c = I.cost(e.kwhDelivered, now);
      box.innerHTML = `<div class="hero2"><p class="big">≈ ${pctTxt(e.pct)}<small>%</small></p><p class="sub">${kwhTxt(e.kwhDelivered)} kWh hasta ahora · corta a las ${hhmm(I.stop)}</p><p class="find">Al corte ≈ ${pctTxt(eStop.pct)}% (${kwhTxt(eStop.kwhDelivered)} kWh). Desde ${pctTxt(a.startPct)}% a las ${hhmm(I.start)}.</p></div>`
        + (c ? `<div class="kv"><span>Costo hasta ahora</span><b>${money(c.total)}</b></div>` : '')
        + `<button class="pill" id="aFinish">Terminar ahora</button><button class="link" id="aCancel">Cancelar carga</button>`;
    }
  }

  /** La carga se guarda recién acá, con lo real: % final, kWh (se recalculan del %) y odómetro. */
  function renderConfirm(I) {
    confirmEnd = confirmAt || I.stop;
    const e = I.est(confirmEnd), cf = I.a.cf || {}, odo = cf.odo != null ? cf.odo : I.a.odo != null ? I.a.odo : '';
    $('#activa').innerHTML = `<div class="hero2"><p class="sub">Terminó la carga</p><p class="find">Estimado ≈ ${pctTxt(e.pct)}% · ${kwhTxt(e.kwhDelivered)} kWh. Confirmá lo real.</p></div>`
      + field('c-pct', '% final real', `<input id="c-pct" inputmode="decimal" autocomplete="off" value="${esc(cf.pct != null ? cf.pct : pctTxt(e.pct))}">`)
      + field('c-kwh', 'kWh reales', `<input id="c-kwh" inputmode="decimal" autocomplete="off" value="${esc(cf.kwh != null ? cf.kwh : kwhTxt(e.kwhDelivered))}">`, 'Se calcula del % (batería × diferencia). Cambialo si el cargador marcó otro valor.')
      + field('c-odo', 'Odómetro (km, opcional)', `<input id="c-odo" inputmode="decimal" autocomplete="off" value="${esc(odo)}">`)
      + `<p class="note" id="c-err" style="color:var(--warn)"></p><button class="pill" id="cSave">Guardar carga</button><button class="link" id="cDiscard">Descartar</button>`;
  }

  $('#activa').addEventListener('input', (e) => {
    if (!S.active || !['c-pct', 'c-kwh', 'c-odo'].includes(e.target.id)) return;
    if (e.target.id === 'c-pct') {
      const v = num(e.target.value);
      if (isFinite(v)) $('#c-kwh').value = kwhTxt(Math.max(0, r2(((v - S.active.startPct) / 100) * S.vehicle.batteryKwh)));
    }
    // lo escrito se guarda en cada cambio: si se cierra la app, el formulario vuelve como estaba
    S.active.cf = { pct: $('#c-pct').value, kwh: $('#c-kwh').value, odo: $('#c-odo').value };
    persist();
  });
  $('#activa').addEventListener('click', (e) => {
    const id = e.target.id, a = S.active;
    if (!a) return;
    if (id === 'aNow') { a.startAt = new Date().toISOString(); a.mode = 'live'; persist(); renderActiva(); renderStatus(); }
    else if (id === 'aEdit') { closeFn(); openFn('prog'); }
    else if (id === 'aCancel') { if (confirm('¿Cancelar esta carga?')) { S.active = null; persist(); renderStatus(); closeFn(); } }
    else if (id === 'aFinish') { confirmAt = new Date(); a.endedAt = confirmAt.toISOString(); persist(); confirmShown = false; renderActiva(); renderStatus(); }
    else if (id === 'cDiscard') { if (confirm('¿Descartar esta carga sin guardarla?')) { S.active = null; confirmAt = null; confirmShown = false; persist(); renderStatus(); closeFn(); } }
    else if (id === 'cSave') saveActive();
  });

  function saveActive() {
    const a = S.active, err = $('#c-err'), pct = num($('#c-pct').value), kwh = num($('#c-kwh').value), odoRaw = $('#c-odo').value.trim(), odo = num(odoRaw);
    if (!isFinite(pct) || pct < 0 || pct > 100) { err.textContent = 'Ingresá un % final válido (0 a 100).'; return; }
    if (!isFinite(kwh) || kwh <= 0) { err.textContent = 'Los kWh reales tienen que ser mayores a cero.'; return; }
    try {
      const start = new Date(a.startAt);
      if (confirmEnd - start < 60000) confirmEnd = new Date(start.getTime() + 60000); // el motor necesita al menos un minuto de carga
      const r = L.computeHomeChargeCost(start, confirmEnd, r2(kwh), S.rates, S.puntaStart, { nominalKw: nominalKw(), calibration: calibration().factor, startPct: a.startPct, batteryKwh: S.vehicle.batteryKwh });
      S.charges.push({ id: Date.now(), location: 'home', startAt: start.toISOString(), endAt: r.finishedAt.toISOString(), kwh: r2(kwh), odometerKm: odoRaw !== '' && isFinite(odo) ? odo : null, startPct: a.startPct, endPct: r1(pct), pricePerKwh: null, fixedFee: null, network: null, cost: r.total, valleKwh: r.valleKwh, llanoKwh: r.llanoKwh, puntaKwh: r.puntaKwh });
      S.active = null; confirmAt = null; confirmShown = false; persist();
      while (stack.length) closeFn();
      renderAll(); renderStatus();
      flash(`Carga guardada · ${money(r.total)}`);
    } catch (e) { err.textContent = e.message; }
  }

  let tickN = 0;
  function tick() {
    renderStatus();
    if (++tickN % 30 === 0) renderDraft(); // actualiza el «hace X min»
    if (S.active && stack[stack.length - 1] === 'activa') renderActiva();
  }
  setInterval(tick, 1000);

  /* ================= Historial / Gasto / Autonomía / Precios ================= */
  /* ================= Historial: calendario ================= */
  const DOW = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const H = { f: 'all', y: null, m: null, day: undefined, dir: 0, lastF: 'all' };
  const hTime = (c) => new Date(c.startAt);

  /** Barra de franjas de una carga en Casa (Valle / Llano / Punta); contorno para las públicas, que no tienen franja. */
  function stackH(c) {
    if (c.location === 'public') return '<div class="outl"></div>';
    const t = c.valleKwh + c.llanoKwh + c.puntaKwh || 1;
    return `<div class="stackh">${[['v1', c.valleKwh], ['v2', c.llanoKwh], ['v3', c.puntaKwh]].map(([k, v]) => `<i class="${k}" style="flex:${v / t}"></i>`).join('')}</div>`;
  }
  const hWhere = (c) => (c.location === 'home' ? `Casa · Valle ${Math.round((c.valleKwh / c.kwh) * 100)}%` : esc(c.network || 'Pública'));
  const hPct = (c) => (c.startPct != null ? ` · ${pctTxt(c.startPct)}→${pctTxt(c.endPct)}%` : '');
  function hDetail(c) {
    const d = hTime(c), kv = (l, v, em = '') => `<div class="dk"><span>${l}</span><b>${v}${em ? `<em>${em}</em>` : ''}</b></div>`;
    let h = '<div class="det">';
    if (c.location === 'home') {
      const e = new Date(c.endAt), p = (k) => Math.round((c[k + 'Kwh'] / c.kwh) * 100);
      h += kv('Horario', `${hhmm(d)} → ${hhmm(e)}`, fmtDur((e - d) / 60000)) + `<div class="dbar">${stackH(c)}</div>` + kv('Franjas', `Valle ${p('valle')}%`, `Llano ${p('llano')}% · Punta ${p('punta')}%`);
    } else h += kv('Red', esc(c.network || 'Pública')) + kv('Precio', `${money2(c.pricePerKwh)}/kWh`, c.fixedFee > 0 ? `+ ${money(c.fixedFee)} fijo` : '');
    if (c.startPct != null) h += kv('Batería', `${pctTxt(c.startPct)} → ${pctTxt(c.endPct)}%`);
    h += kv('Odómetro', c.odometerKm != null ? `${int(c.odometerKm)} km` : '—') + kv('Costo por kWh', money2(c.cost / c.kwh));
    return h + `<button class="ddel" data-del="${c.id}">Eliminar esta carga</button></div>`;
  }
  const hLegend = '<div class="legend"><span class="l1">Valle</span><span class="l2">Llano</span><span class="l3">Punta</span><span class="l4">Pública</span></div>';
  const hTabs = () => `<div class="htabs" role="group" aria-label="Filtrar">${[['all', 'Todas'], ['home', 'Casa'], ['public', 'Pública']].map(([k, l]) => `<button data-f="${k}" aria-pressed="${H.f === k}">${l}</button>`).join('')}</div>`;
  const hList = () => S.charges.filter((c) => H.f === 'all' || c.location === H.f);
  const hSummary = (list) => `<p class="hsub"><b>${money(list.reduce((a, c) => a + c.cost, 0))}</b> · ${int(list.reduce((a, c) => a + c.kwh, 0))} kWh · ${list.length} ${list.length === 1 ? 'carga' : 'cargas'}</p>`;

  /* ----- Calendario: cada día es una barra de energía apilada por franja ----- */
  function calHtml() {
    const list = hList();
    if (H.y == null) { const last = [...S.charges].sort((a, b) => hTime(b) - hTime(a))[0], d = last ? hTime(last) : new Date(); H.y = d.getFullYear(); H.m = d.getMonth(); }
    const first = new Date(H.y, H.m, 1), lead = (first.getDay() + 6) % 7, days = new Date(H.y, H.m + 1, 0).getDate(), now = new Date();
    const inMonth = list.filter((c) => hTime(c).getFullYear() === H.y && hTime(c).getMonth() === H.m);
    const byDay = new Map(); inMonth.forEach((c) => { const d = hTime(c).getDate(); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(c); });
    // al cambiar de mes o de filtro no queda ningún día elegido: el panel del día se abre con un toque
    if (H.day === undefined || (H.day != null && H.f !== H.lastF)) H.day = null;
    H.lastF = H.f; calCache = { byDay };
    const maxKwh = Math.max(...S.charges.map((c) => c.kwh), 1), cells = [];
    for (let i = 0; i < Math.ceil((lead + days) / 7) * 7; i++) {
      const d = i - lead + 1;
      if (d < 1 || d > days) { cells.push('<span></span>'); continue; }
      const cs = byDay.get(d) || [], isToday = H.y === now.getFullYear() && H.m === now.getMonth() && d === now.getDate();
      const bars = cs.map((c) => {
        const h = Math.max(4, (c.kwh / maxKwh) * 38);
        if (c.location === 'public') return `<span style="height:${h}px"><div class="outl"></div></span>`;
        const t = c.valleKwh + c.llanoKwh + c.puntaKwh;
        return `<span style="height:${h}px"><span class="stackv">${[['v1', c.valleKwh], ['v2', c.llanoKwh], ['v3', c.puntaKwh]].filter(([, v]) => v / t > 0.001).map(([k, v]) => `<i class="${k}" style="flex:${v / t}"></i>`).join('')}</span></span>`;
      }).join('');
      const lbl = `${d} de ${MONTHS[H.m]}${cs.length ? `, ${cs.length} ${cs.length === 1 ? 'carga' : 'cargas'}, ${kwhTxt(cs.reduce((a, c) => a + c.kwh, 0))} kWh` : ', sin cargas'}`;
      cells.push(`<button class="day${isToday ? ' today' : ''}" data-d="${d}" aria-label="${lbl}" aria-pressed="${H.day === d}"><span class="dn">${d}</span><span class="dbars">${bars}</span></button>`);
    }
    const nav = (k, p) => `<button class="mnav" data-nav="${k}" aria-label="${k < 0 ? 'Mes anterior' : 'Mes siguiente'}"><svg width="20" height="20" viewBox="0 0 20 20"><path d="${p}"/></svg></button>`;
    const anim = H.dir ? ` slide${H.dir < 0 ? ' back' : ''}` : '';
    H.dir = 0;
    return `<div class="hh">${hSummary(inMonth)}${hTabs()}<div class="mhead"><h3>${MONTHS[H.m]} ${H.y}</h3><div>${nav(-1, 'M12 4l-6 6 6 6')}${nav(1, 'M8 4l6 6-6 6')}</div></div>`
      + `<div class="wk">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x) => `<span>${x}</span>`).join('')}</div><div class="gridwrap${anim}"><div class="cgrid">${cells.join('')}</div></div>${hLegend}</div>`;
  }
  let calCache = { byDay: new Map() };
  /** Contenido del panel del día: el título y cada carga con su detalle. */
  function hudHtml() {
    const d = new Date(H.y, H.m, H.day), cs = calCache.byDay.get(H.day) || [];
    const sub = cs.length > 1 ? `<p>${cs.length} cargas · ${kwhTxt(cs.reduce((a, c) => a + c.kwh, 0))} kWh · ${money(cs.reduce((a, c) => a + c.cost, 0))}</p>` : '';
    return `<div class="hud-bar"><div><h4>${cap(DOW[d.getDay()])} ${d.getDate()} de ${MONTHS[d.getMonth()]}</h4>${sub}</div><button class="icon" data-hud="close" aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>`
      + `<div class="hud-body">${cs.map((c) => `<div class="cd"><div class="top"><b>${kwhTxt(c.kwh)} kWh</b><span>${money(c.cost)}</span></div><div class="l2">${hWhere(c)}${hPct(c)}</div>${hDetail(c)}</div>`).join('') || '<p class="none">Sin cargas ese día.</p>'}</div>`;
  }
  const hud = $('#dayHud'), hudIsOpen = () => hud.classList.contains('open');
  const hudMark = () => $('#hist').querySelectorAll('.day').forEach((b) => b.setAttribute('aria-pressed', H.day != null && Number(b.dataset.d) === H.day));
  /** Abre (o actualiza) el panel y, si el día quedó tapado, corre el calendario para que se vea por encima. */
  function openHud() {
    hud.innerHTML = hudHtml(); hud.inert = false; hud.classList.add('open'); hudMark();
    const hist = $('#hist'), hh = hist.querySelector('.hh'), btn = hist.querySelector(`.day[data-d="${H.day}"]`);
    hist.style.setProperty('--hud-h', hud.offsetHeight + 'px');
    if (btn && hh) requestAnimationFrame(() => {
      const top = $('#fn-historial').getBoundingClientRect().top + hud.offsetTop, over = btn.getBoundingClientRect().bottom - (top - 8);
      if (over > 0) hh.scrollBy({ top: over, behavior: 'smooth' });
    });
  }
  function closeHud() {
    H.day = null; hudMark();
    if (!hudIsOpen()) return;
    hud.classList.remove('open'); hud.inert = true; hud.style.transform = ''; $('#hist').style.setProperty('--hud-h', '0px');
  }
  hud.addEventListener('click', (e) => {
    const del = e.target.closest('[data-del]');
    if (e.target.closest('[data-hud="close"]')) closeHud();
    else if (del && confirm('¿Eliminar esta carga? No se puede deshacer.')) { S.charges = S.charges.filter((c) => c.id !== Number(del.dataset.del)); persist(); renderAll(); }
  });
  (function swipeDownToClose() { // arrastrar la barra del panel hacia abajo lo cierra
    let y0 = null, dy = 0;
    hud.addEventListener('pointerdown', (e) => { if (!e.target.closest('.hud-bar') || e.target.closest('button')) return; y0 = e.clientY; dy = 0; try { hud.setPointerCapture(e.pointerId); } catch (_) {} hud.classList.add('drag'); });
    hud.addEventListener('pointermove', (e) => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); hud.style.transform = `translateY(${dy}px)`; });
    const end = () => { if (y0 == null) return; y0 = null; hud.classList.remove('drag'); if (dy > 70) closeHud(); else hud.style.transform = ''; };
    hud.addEventListener('pointerup', end); hud.addEventListener('pointercancel', end);
  })();
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && hudIsOpen()) { closeHud(); e.stopImmediatePropagation(); } }, true); // Escape cierra primero el panel

  function renderList() { $('#hist').innerHTML = calHtml(); if (hudIsOpen()) openHud(); }
  const calGo = (k) => { const d = new Date(H.y, H.m + k, 1); H.y = d.getFullYear(); H.m = d.getMonth(); H.day = undefined; H.dir = k; closeHud(); renderList(); };
  $('#hist').addEventListener('click', (e) => {
    const f = e.target.closest('[data-f]'), nav = e.target.closest('[data-nav]'), day = e.target.closest('[data-d]');
    if (f) { closeHud(); H.f = f.dataset.f; renderList(); }
    else if (nav) calGo(Number(nav.dataset.nav));
    else if (day) { // un toque en un día abre su panel; otro toque en el mismo lo cierra
      const d = Number(day.dataset.d);
      if (hudIsOpen() && H.day === d) closeHud(); else { H.day = d; openHud(); }
    } else if (hudIsOpen()) closeHud();
  });
  (function swipeMonths() { // deslizar el calendario cambia de mes
    let x0 = null, y0 = 0;
    $('#hist').addEventListener('pointerdown', (e) => { if (e.target.closest('.gridwrap')) { x0 = e.clientX; y0 = e.clientY; } });
    $('#hist').addEventListener('pointerup', (e) => {
      if (x0 == null) return;
      const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) calGo(dx < 0 ? 1 : -1);
    });
  })();

  let gPeriod = '30d';
  const DAY = 864e5;
  /** Período del resumen: 30 días corridos (vs los 30 anteriores) o mes calendario (vs el mismo tramo del mes anterior). */
  function period(now) {
    const end = new Date(now.getTime() + 1);
    if (gPeriod === 'mes') {
      const from = L.startOfMonth(now), c = L.compareToPrevMonth(S.charges, now);
      return { from, end, cmp: c, vs: `el mismo tramo de ${MONTHS[L.startOfMonth(now, 1).getMonth()]}` };
    }
    const from = new Date(now.getTime() - 30 * DAY), prev = L.statsBetween(S.charges, new Date(now.getTime() - 60 * DAY), from).total;
    const cur = L.statsBetween(S.charges, from, end).total;
    return { from, end, cmp: { cur, prev, deltaPct: prev > 0 ? ((cur - prev) / prev) * 100 : null }, vs: 'los 30 días anteriores' };
  }

  function renderGasto() {
    const now = new Date(), p = period(now), cmp = p.cmp;
    const s = L.statsBetween(S.charges, p.from, p.end);
    const saved = S.charges.filter((c) => new Date(c.startAt) >= p.from).reduce((a, c) => a + (c.location === 'home' ? L.valleSavings(c, S.rates) : 0), 0);
    const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);
    let h = `<div class="seg wide" role="group" aria-label="Período"><button data-gp="30d" aria-pressed="${gPeriod === '30d'}">30 días</button><button data-gp="mes" aria-pressed="${gPeriod === 'mes'}">Este mes</button></div>`;
    h += `<div class="hero2"><p class="big"><span class="cur">$</span>${int(s.total)}</p><p class="sub">${int(s.kwh)} kWh · ${s.count} ${s.count === 1 ? 'carga' : 'cargas'}</p>`;
    if (cmp.deltaPct != null) h += `<p class="find">${cmp.deltaPct >= 0 ? '↑' : '↓'} ${Math.abs(Math.round(cmp.deltaPct))}% frente a ${p.vs} (${money(cmp.prev)}).</p>`;
    h += `</div>`;
    h += `<h3>Costos</h3><div class="kv"><span>Promedio por kWh</span><b>${s.kwh > 0 ? money2(s.avgPerKwh) : '—'}</b></div>`;
    h += `<div class="kv"><span>Costo por km<em>${s.costPerKm != null ? 'según tu odómetro' : 'cargá el odómetro en 2 cargas'}</em></span><b>${s.costPerKm != null ? money2(s.costPerKm) : '—'}</b></div>`;
    h += `<h3>Casa y pública</h3><div class="kv"><span>Casa<em>${int(s.homeKwh)} kWh · ${pct(s.homeKwh, s.kwh)}% de la energía</em></span><b>${money(s.homeCost)}</b></div>`;
    h += `<div class="kv"><span>Pública<em>${int(s.publicKwh)} kWh · ${pct(s.publicKwh, s.kwh)}% de la energía</em></span><b>${money(s.publicCost)}</b></div>`;
    h += `<h3>En Casa, por franja</h3>` + (s.homeKwh > 0 ? bands(s.vallePct, s.llanoPct, s.puntaPct) : '<p class="note">Sin cargas en casa este mes.</p>');
    if (saved > 1) h += `<p class="note">Cargando todo en Valle hubieras gastado ${money(saved)} menos en este período.</p>`;
    $('#gasto').innerHTML = h;
  }

  $('#gasto').addEventListener('click', (e) => { const b = e.target.closest('[data-gp]'); if (b) { gPeriod = b.dataset.gp; $('#gTitle').textContent = gPeriod === 'mes' ? 'Este mes' : 'Últimos 30 días'; renderAll(); } });

  let autoPct = 80;
  function renderAuto() {
    const v = S.vehicle, { real, rc } = consumption();
    const src = { 'real-bateria': `medido en ${rc.samples} ${rc.samples === 1 ? 'tramo' : 'tramos'} (batería)`, 'real-pared': `medido en ${rc.samples} tramos (desde el enchufe)`, homologado: 'del fabricante; cargá odómetro y % para medirlo' }[rc.source];
    const km = L.rangeAtPct(v.batteryKwh, rc.whKm, autoPct), now = new Date(), s30 = L.statsBetween(S.charges, new Date(now.getTime() - 30 * 864e5), new Date(now.getTime() + 1));
    let h = `<div class="hero2"><p class="big">≈ ${km}<small>km</small></p><p class="sub">con la batería al <input class="inl" id="a-pct" inputmode="decimal" aria-label="Nivel de batería, en porcentaje" value="${pctTxt(autoPct)}">%</p><p class="find">${dec(L.whKmToKwh100(rc.whKm), 1)} kWh/100 km ${src}.</p>`;
    h += `<div class="seg wide" role="group" aria-label="Nivel de batería">${[20, 40, 60, 80, 100].map((p) => `<button data-ap="${p}" aria-pressed="${p === autoPct}">${p}%</button>`).join('')}</div></div>`;
    h += `<h3>Consumo</h3><div class="kv"><span>Real</span><b>${real && (real.batteryWhKm || real.wallWhKm) ? dec(L.whKmToKwh100(real.batteryWhKm || real.wallWhKm * L.ETA_AC), 1) + ' kWh/100 km' : '—'}</b></div>`;
    h += `<div class="kv"><span>Desde el enchufe<em>incluye pérdidas de carga</em></span><b>${real && real.wallWhKm ? dec(L.whKmToKwh100(real.wallWhKm), 1) + ' kWh/100 km' : '—'}</b></div>`;
    h += `<div class="kv"><span>Homologado</span><b>${dec(L.whKmToKwh100(v.consumptionWhKm), 1)} kWh/100 km</b></div>`;
    h += `<div class="kv"><span>Autonomía homologada</span><b>${L.autonomyKm(v.batteryKwh, v.consumptionWhKm)} km</b></div>`;
    h += `<h3>Mi auto y mi cargador</h3>`;
    h += `<div class="pair">${field('v-bat', 'Batería (kWh)', `<input id="v-bat" inputmode="decimal" value="${v.batteryKwh}">`)}${field('v-con', 'Consumo (Wh/km)', `<input id="v-con" inputmode="decimal" value="${v.consumptionWhKm}">`)}</div>`;
    h += `<div class="pair">${field('v-amp', 'Cargador (A)', `<input id="v-amp" inputmode="decimal" value="${S.amps}">`)}${field('v-volt', 'Tensión (V)', `<input id="v-volt" inputmode="decimal" value="${S.volts}">`)}</div>`;
    h += `<p class="note">${v.name} · cargador de casa ≈ ${dec(nominalKw(), 1)} kW. Costo de los últimos 30 días: ${s30.costPerKm != null ? money2(s30.costPerKm) + '/km' : 'sin datos de odómetro'}.</p>`;
    $('#auto').innerHTML = h;
  }
  $('#auto').addEventListener('click', (e) => { const b = e.target.closest('[data-ap]'); if (b) { autoPct = +b.dataset.ap; const y = $('#auto').scrollTop; renderAuto(); $('#auto').scrollTop = y; } });
  $('#auto').addEventListener('change', (e) => {
    const n = num(e.target.value); if (!(n > 0)) return;
    if (e.target.id === 'a-pct') { autoPct = Math.min(100, r1(n)); const y = $('#auto').scrollTop; renderAuto(); $('#auto').scrollTop = y; return; }
    ({ 'v-bat': () => (S.vehicle.batteryKwh = n), 'v-con': () => (S.vehicle.consumptionWhKm = n), 'v-amp': () => (S.amps = n), 'v-volt': () => (S.volts = n) }[e.target.id] || (() => {}))();
    persist(); const y = $('#auto').scrollTop; renderAll(); $('#auto').scrollTop = y;
  });

  function renderPrecios() {
    const r = S.rates, ps = S.puntaStart, now = new Date();
    let h = `<h3>UTE · Triple horaria residencial</h3>`;
    h += `<div class="pair">${field('r-valle', 'Valle $/kWh', `<input id="r-valle" inputmode="decimal" value="${String(r.valle).replace('.', ',')}">`, '00:00 a 07:00, todos los días')}${field('r-llano', 'Llano $/kWh', `<input id="r-llano" inputmode="decimal" value="${String(r.llano).replace('.', ',')}">`, 'el resto')}</div>`;
    h += field('r-punta', 'Punta $/kWh', `<input id="r-punta" inputmode="decimal" value="${String(r.punta).replace('.', ',')}">`, `${ps}:00 a ${ps + 4}:00, solo días hábiles`);

  /** Las cargas propias (sin los datos de ejemplo) y lo que hace falta para rearmar la app en otro teléfono. */
  function buildBackup() {
    return { app: 'carga', version: 1, exportedAt: new Date().toISOString(), vehicle: S.vehicle, rates: S.rates, puntaStart: S.puntaStart, amps: S.amps, volts: S.volts, chips: S.chips, bg: S.bg,

  /** En iPhone se comparte el archivo (Guardar en Archivos, AirDrop…); donde no se puede, se descarga. */
  async function exportBackup() {
    const data = buildBackup(), d = new Date(), p2 = (n) => String(n).padStart(2, '0');
    const name = `carga-respaldo-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.json`;
    const file = new File([JSON.stringify(data, null, 1)], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'Respaldo de Carga' });
      else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
        document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return; // cerró la hoja de compartir
      ajMsg = { text: 'No se pudo guardar el respaldo. Probá de nuevo.', kind: 'err' }; renderAjustes(); return;

  /* ----- Taller de fichas ----- */

  });

  /* ----- Fondo ----- */
  const bgSeg = (k, items, sel) => `<div class="seg wide" role="group">${items.map(([v, l]) => `<button data-bg="${k}" data-v="${v}" aria-pressed="${String(sel) === v}">${l}</button>`).join('')}</div>`;
  function renderFondo() {
    const b = S.bg, y = $('#fondo').scrollTop;
    const tint = b.tint === 'color' ? b.color : b.tint === 'ficha' ? S.chips[CHIP_IDS[homeRail.index]].color : null;
    const ground = tint ? hexMix('#000000', tint, 0.14) : '#1c1c1e'; // las muestras de textura se ven sobre el fondo que quedaría
    let h = `<div class="fx-sec"><h3>Tinte</h3>${bgSeg('tint', BG_TINTS, b.tint)}`;
    if (b.tint === 'color') h += `<div class="fx-sw" role="group" aria-label="Color del tinte" style="margin-top:10px">${CHIP_COLORS.map(([hex, n]) => `<button data-bg="color" data-v="${hex}" aria-label="${n}" aria-pressed="${hex === b.color}"><i style="background:${hex}"></i></button>`).join('')}</div>`;
    h += '</div>';
    h += `<div class="fx-sec"><h3>Textura</h3><div class="fx-tex" role="group" aria-label="Textura">${CHIP_TEXTURES.map(([id, n]) => `<button data-bg="tex" data-v="${id}" aria-pressed="${id === b.tex}"><i><svg class="chip" viewBox="0 0 126 126" aria-hidden="true" style="--cc:${ground};--ce:#fff"><circle class="body" cx="63" cy="63" r="63"/>${texSvg(id)}<circle class="rim" cx="63" cy="63" r="62"/></svg></i>${n}</button>`).join('')}</div></div>`;
    h += `<div class="fx-sec"><h3>Movimiento</h3>${bgSeg('motion', [['1', 'Sutil'], ['0', 'Quieto']], b.motion ? '1' : '0')}`;
    if (reduceMotion.matches) h += '<p class="note">Tenés activado «Reducir movimiento» en el teléfono: el fondo queda quieto.</p>';
    h += '</div><button class="link ghost" data-bg="reset">Restablecer fondo</button>';

  }
  $('#fondo').addEventListener('click', (e) => {
    const t = e.target.closest('[data-bg]'); if (!t) return;
    const k = t.dataset.bg, v = t.dataset.v;
    S.bg = cleanBg(k === 'reset' ? null : { ...S.bg, [k]: k === 'motion' ? v === '1' : v });
    persist(); bgApply(); renderFondo();
  });

  /* ---------- Selectores con globo de cristal (.seg) ---------- */
  const segLast = new Map(); // dónde estaba el globo de cada selector (por pantalla y orden): al redibujarlo sale de ahí y se desliza
  const segKey = (seg) => { const host = seg.closest('.fn'); return `${host ? host.id : ''}|${[...(host || document).querySelectorAll('.seg')].indexOf(seg)}`; };
  /** Pone el globo sobre la opción elegida (lo crea si falta). */
  function segSync(seg) {
    const sel = seg.querySelector('button[aria-pressed="true"]'); if (!sel || !sel.offsetWidth) return;
    let t = seg.querySelector(':scope > .thumb');
    if (!t) {
      t = document.createElement('i'); t.className = 'thumb'; t.setAttribute('aria-hidden', 'true'); seg.prepend(t); seg.classList.add('has-thumb');
      const prev = segLast.get(segKey(seg));
      t.style.transition = 'none'; t.style.width = `${prev ? prev.w : sel.offsetWidth}px`; t.style.setProperty('--x', `${prev ? prev.x : sel.offsetLeft}px`);
      void t.offsetWidth; t.style.transition = '';
    }
    t.style.width = `${sel.offsetWidth}px`; t.style.setProperty('--x', `${sel.offsetLeft}px`);
    segLast.set(segKey(seg), { x: sel.offsetLeft, w: sel.offsetWidth });
  }
  const segAll = () => document.querySelectorAll('.seg').forEach(segSync);
  new MutationObserver((list) => {
    const segs = new Set();
    for (const m of list) {
      if (m.type === 'attributes') { const g = m.target.closest('.seg'); if (g) segs.add(g); continue; }
      m.addedNodes.forEach((n) => { if (n.nodeType === 1) { if (n.matches('.seg')) segs.add(n); n.querySelectorAll('.seg').forEach((g) => segs.add(g)); } });
    }
    segs.forEach(segSync);
  }).observe(appEl, { childList: true, subtree: true, attributes: true, attributeFilter: ['aria-pressed'] });
  addEventListener('resize', segAll);
  if (document.fonts) document.fonts.ready.then(segAll);
  (function segDrag() { // mantener apretada la opción elegida y arrastrar: el globo la sigue y al soltar elige la que quedó debajo
    let d = null, swallow = false;
    document.addEventListener('pointerdown', (e) => {
      const seg = e.target.closest('.seg.has-thumb'), sel = seg && seg.querySelector('button[aria-pressed="true"]');
      if (!seg || !sel || e.button > 0 || e.target.closest('button') !== sel) return;
      const t = seg.querySelector(':scope > .thumb'), bs = [...seg.querySelectorAll('button')];
      d = { seg, t, sel, bs, id: e.pointerId, x0: e.clientX, left: sel.offsetLeft, moved: false, hot: sel };
      t.classList.add('press');
      try { seg.setPointerCapture(e.pointerId); } catch (_) {}
    });
    document.addEventListener('pointermove', (e) => {
      if (!d || e.pointerId !== d.id) return;
      const dx = e.clientX - d.x0;
      if (!d.moved && Math.abs(dx) > 3) { d.moved = true; d.t.classList.add('drag'); }
      if (!d.moved) return;
      const first = d.bs[0], last = d.bs[d.bs.length - 1], w = d.t.offsetWidth, lo = first.offsetLeft, hi = last.offsetLeft + last.offsetWidth - w;
      const x = Math.max(lo, Math.min(hi, d.left + dx)), mid = x + w / 2;
      const hot = d.bs.find((b) => mid >= b.offsetLeft && mid < b.offsetLeft + b.offsetWidth) || d.hot;
      if (hot !== d.hot) { d.hot.classList.remove('hot'); hot.classList.add('hot'); d.hot = hot; d.t.style.width = `${hot.offsetWidth}px`; }
      d.t.style.setProperty('--x', `${x}px`);
      segLast.set(segKey(d.seg), { x, w: hot.offsetWidth });
    });

      if (!d || e.pointerId !== d.id) return;
      const { seg, t, sel, hot, moved } = d; d = null;
      t.classList.remove('press', 'drag'); hot.classList.remove('hot');
      if (!moved) return;
      if (e.type === 'pointerup' && hot !== sel) hot.click(); else segSync(seg); // elegir la opción, o volver a la que estaba
      swallow = true; setTimeout(() => (swallow = false), 0); // el clic nativo que sigue a soltar no debe elegir nada
    };
    document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
    document.addEventListener('click', (e) => { if (swallow) { e.stopPropagation(); e.preventDefault(); } }, true);
  })();

  /* ---------- Render general ---------- */
  function renderTop() {
    const p = period(new Date()), s = L.statsBetween(S.charges, p.from, p.end);
    $('#topBar').innerHTML = `<b style="font-weight:400">${money(s.total)}</b> <span>· ${gPeriod === 'mes' ? 'este mes' : '30 días'}</span>`;

  /* ---------- Arranque ---------- */
  /**
   * Diagnóstico de pantalla: con #debug en la dirección, o manteniendo apretada la línea de arriba del inicio, se ven las medidas reales
   * (en el iPhone 17 Pro: ventana 402 × 781 de pantalla 402 × 874, porque iOS descuenta 59 arriba y 34 abajo).
   */
  let dbg = null;
  function report() {
    if (!dbg) return;
    const r = $('#app').getBoundingClientRect(), vv = window.visualViewport;
    dbg.textContent = `ventana ${innerWidth}×${innerHeight} · pantalla ${screen.width}×${screen.height} · visual ${vv ? Math.round(vv.height) : '-'} · app instalada ${navigator.standalone === true} · instalada ${navigator.standalone === true}/${matchMedia('(display-mode: standalone)').matches} · arriba ${document.documentElement.style.getPropertyValue('--lower')} · abajo ${document.documentElement.style.getPropertyValue('--lower-b')} · fichas bajan ${$('#app').style.getPropertyValue('--tray-shift')} · app ${Math.round(r.top)}→${Math.round(r.bottom)} · seguro ${Math.round(parseFloat(getComputedStyle($('#app')).getPropertyValue('--safe-top')) || 0)}/${Math.round(parseFloat(getComputedStyle($('#app')).getPropertyValue('--safe-bottom')) || 0)}`;
  }
  function toggleDebug() {
    if (dbg) { dbg.remove(); dbg = null; return; }
    dbg = document.body.appendChild(Object.assign(document.createElement('p'), { style: 'position:fixed;z-index:999;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 4px);font:11px/1.3 monospace;color:#ff0;background:#000a;padding:4px;pointer-events:none' }));

  }
  /**
   * App instalada de iOS: la bandeja mide 296 y llega a los 874 pt de la pantalla, pero lo que se ve termina a los ~781 (la app y su fondo dejan de dibujarse
   * unos 93 pt antes del borde = 59 de la isla dinámica + 34 de la barra de inicio) y arriba todo queda debajo de la isla, donde iOS difumina.
   * Por eso la app ocupa solo la zona que sí se dibuja: empieza 93 pt más abajo y termina donde iOS corta. La franja de abajo se pinta con el color de la bandeja (html.floor).
   * Los márgenes seguros de la zona se miden con env() en una sonda; con la ventana ya descontada (innerHeight < pantalla) no se descuenta dos veces.

  function fitLower() {

  /**
   * Centra las fichas en la parte de la bandeja que queda encima del margen seguro de abajo (como en la vista de escritorio, que mide 262):
   * el grupo fichas + pista ocupa de 40 a 215 pt desde el borde de arriba de la bandeja.

  function fitTray() {
    const a = $('#app'), t = $('.tray'); if (!a || !t) return;
    fitLower();

    const room = t.offsetHeight - (parseFloat(getComputedStyle(probe).paddingBottom) || 0); // hasta donde puede llegar el contenido

  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
